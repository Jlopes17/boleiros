(15,24),contr:R(8,36),valor:0,les:0,susp:0,tit:i<11,team,star};o.valor=Math.round(o.ov*o.ov*(o.pot/80)*(idade<23?1.25:idade>31?.75:1)*900);return o}function fix(ids){let a=[...ids],out=[];for(let r=0;r<a.length-1;r++){let g=[];for(let i=0;i<a.length/2;i++)g.push({h:a[i],a:a[a.length-1-i]});out.push(g);a=[a[0],a.at(-1),...a.slice(1,-1)]}return[...out,...out.map(x=>x.map(g=>({h:g.a,a:g.h})))]}function novo(o={}){let teams=clubs.map((n,i)=>({id:'t'+i,n,rep:R(56,78)+(i==0?4:0),tor:R(4000,15000),est:R(7000,24000),ct:R(1,3),base:R(1,3),med:R(1,3),st:st(),forma:[]})),players=[];teams.forEach(t=>{for(let i=0;i<18;i++)players.push(p(i,t.id,t.rep,t.id==='t0'&&i==10))});let cal=[];fix(teams.map(t=>t.id)).forEach((gs,r)=>gs.forEach(g=>cal.push({id:'j'+r+g.h+g.a,rod:r+1,h:g.h,a:g.a,ok:false,gh:null,ga:null,comp:'Liga Boleiros'})));return{week:1,season:1,user:{coach:o.coach||'João',club:o.club||'t0'},teams,players,cal,market:Array.from({length:12},(_,i)=>p(i,'mercado',64)),tac:{form:'4-3-3',men:'Equilibrada',press:'Média',ritmo:55,risco:45},train:{foco:'Equilibrado',int:55,rest:35},fin:{saldo:1800000,ing:35,pat:260000,merch:45000},career:{nome:'Léo Boleiro',energia:82,feliz:72,fama:10,grana:1500,skills:{fin:66,pas:58,dri:63,vel:67,def:35},gols:0,ass:0,jogos:0},modo:'mapa',news:['Bem-vindo ao Boleiros. A diretoria quer uma temporada competitiva.'],ach:[]}}function load(){try{return JSON.parse(localStorage.getItem(K)||localStorage.getItem(OLD)||'null')}catch(e){return null}}function save(){if(S)localStorage.setItem(K,JSON.stringify(S))}function C(id=S.user.club){return S.teams.find(t=>t.id===id)}function P(tid=S.user.club){return S.players.filter(p=>p.team===tid)}function XI(tid=S.user.club){return P(tid).filter(p=>p.tit&&!p.les&&!p.susp).slice(0,11)}function avg(a,f){return Math.round(a.reduce((s,x)=>s+f(x),0)/(a.length||1))}function str(tid=S.user.club){let ps=tid===S.user.club?XI():P(tid).sort((a,b)=>b.ov-a.ov).slice(0,11),base=ps.length?avg(ps,p=>p.ov*p.fis/100*p.mor/100*p.form ome do clube</label><input id='edClub' value='${C().n}'></div><div><label>Saldo</label><input id='edMoney' type='number' value='${S.fin.saldo}'></div></div><br><button class='primary' data-act='edit'>Salvar edição</button></section>`},config(){return `<section class='panel'><h2>Configurações</h2><button class='primary' data-act='save'>Salvar</button> <button data-act='export'>Exportar save</button> <button data-act='import'>Importar save</button> <button class='danger' data-act='reset'>Resetar</button><br><br><textarea id='savebox' rows='8' placeholder='Exportar ou colar save aqui'></textarea></section>`}};function openMatch(){let j=next();if(!j)return msg('Sem jogos');M={id:j.id,min:0,gh:0,ga:0,x:50,y:50,ax:84,ay:50,log:['A bola vai rolar.'],mode:S.modo,ch:0};modal.classList.add('open');drawBox();if(M.mode==='mapa')auto()}function drawBox(){let j=S.cal.find(x=>x.id===M.id);box.innerHTML=`<div class='row'><h2>${C(j.h).n} ${M.gh} x ${M.ga} ${C(j.a).n}</h2><button data-close='1'>Fechar</button></div><p class='muted'>${M.min}' • ${M.mode==='mapa'?'Mini mapa':'Lances jogáveis'}</p><canvas id='cv' width='900' height='430'></canvas><br><div class='actions'><button data-mm='mapa'>Mini mapa</button><button data-mm='lances'>Jogar lances</button><button class='primary' data-m='finish'>Encerrar</button></div>${M.mode==='lances'?'<div class="card"><h3>Lance decisivo</h3><p>Toque no campo para mirar.</p><button class="primary" data-lance="chutar">Chutar</button> <button data-lance="passar">Passar</button> <button data-lance="driblar">Driblar</button> <button data-lance="defender">Defender</button></div>':''}<div class='panel'><h3>Narração</h3>${M.log.slice(-6).reverse().map(x=>`<div class='item'>${x}</div>`).join('')}</div>`;drawCanvas()}function drawCanvas(){let c=$('#cv');if(!c)return;let x=c.getContext('2d'),w=c.width,h=c.height;x.fillStyle='#176b34';x.fillRect(0,0,w,h);x.strokeStyle='#fff9';x.lineWidth=3;x.strokeRect(35,35,w-70,h-70);x.beginPath();x.moveTo(w/2,35);x.lineTo(w/2,h-35);x.stroke();[[12,50],[25,25],[25,50],[25,75],[50,35],[50,65],[75,30],[83,50],[75,70]].forEach((p,i)=>{x.fillStyle=i<6?'#c8ffdd':'#ffd166';x.beginPath();x.arc(p[0]*w/100,p[1]*h/100,13,0,7);x.fill()});x.fillStyle='#fff';x.beginPath();x.arc(M.x*w/100,M.y*h/100,8,0,7);x.fill();if(M.mode==='lances'){x.strokeStyle='#ffef9b';x.beginPath();x.moveTo(M.x*w/100,M.y*h/100);x.lineTo(M.ax*w/100,M.ay*h/100);x.stroke()}}function auto(){clearInterval(T);T=setInterval(()=>{if(!M||M.mode!=='mapa'){clearInterval(T);return}M.min+=R(4,8);M.x=cl(M.x+R(-18,18),5,95);M.y=cl(M.y+R(-22,22),8,92);let j=S.cal.find(x=>x.id===M.id),home=j.h===S.user.club,chance=.22+(str(S.user.club)-str(home?j.a:j.h))/260;if(Math.random()<.35){if(Math.random()<chance){home?M.gh++:M.ga++;M.log.push(`${M.min}' GOOOL do ${C().n}!`)}else if(Math.random()<.42){home?M.ga++:M.gh++;M.log.push(`${M.min}' Gol adversário.`)}else M.log.push(`${M.min}' Defesaça do goleiro.`)}if(M.min>=90)finish();else drawBox()},750)}function lance(a){let j=S.cal.find(x=>x.id===M.id),home=j.h===S.user.club,c=S.career,prob=.42+c.skills.fin/240+c.energia/650-Math.abs(M.ay-50)/180;if(a==='passar')prob+=c.skills.pas/450;if(a==='driblar')prob+=c.skills.dri/420-.04;if(a==='defender')prob=.45+c.skills.def/220;let ok=Math.random()<prob;M.min=cl(M.min+R(10,18),1,90);if(ok){if(a==='defender'){M.log.push(`${M.min}' Defesa decisiva.`)}else{home?M.gh++:M.ga++;c.gols++;c.fama=cl(c.fama+3);M.log.push(`${M.min}' Lance perfeito. Gol do Boleiro!`)}}else{if(a==='defender'){home?M.ga++:M.gh++;M.log.push(`${M.min}' Não deu. Gol deles.`)}else M.log.push(`${M.min}' Tentou ${a}, mas errou.`)}c.energia=cl(c.energia-R(4,8));M.ch++;if(M.min>=90||M.ch>=6)finish();else drawBox()}function finish(){clearInterval(T);let j=S.cal.find(x=>x.id===M.id),others=S.cal.filter(x=>!x.ok&&x.rod===j.rod&&x.id!==j.id),b=score(j.h,j.a);apply(j,Math.max(M.gh,b[0]),Math.max(M.ga,b[1]));others.forEach(o=>{let s=score(o.h,o.a);apply(o,s[0],s[1])});M=null;modal.classList.remove('open');train();S.week++;render();msg('Partida encerrada')}function train(){P().forEach(p=>{p.fis=cl(p.fis-S.train.int/25+S.train.rest/30);p.forma=cl(p.forma+(S.train.int-45)/20+R(-2,3));if(p.les)p.les--;if(Math.random()<Math.max(0,(S.train.int-75)/500))p.les=R(1,4)});S.career.energia=cl(S.career.energia+(S.train.rest-35)/5-(S.train.int-50)/8)}function week(){let rs=rodada();if(rs.length)rs.forEach(j=>{let s=score(j.h,j.a);apply(j,s[0],s[1])});train();S.week++;render();msg('Semana avançada')}function autoXI(){P().forEach(p=>p.tit=false);P().filter(p=>!p.les&&!p.susp).sort((a,b)=>b.ov-a.ov).slice(0,11).forEach(p=>p.tit=true);render()}function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.start==='new')return setup();if(b.dataset.start==='cont'){S=load();return render()}if(b.dataset.start==='demo'){S=novo();return render()}if(b.dataset.start==='how'){modal.classList.add('open');box.innerHTML='<div class="row"><h2>Como jogar</h2><button data-close="1">Fechar</button></div><div class="grid"><div class="card"><b>Prepare</b><p class="muted">Ajuste treino, escalação e táticas.</p></div><div class="card"><b>Jogue</b><p class="muted">Escolha mini mapa ou lances jogáveis.</p></div><div class="card"><b>Gerencie</b><p class="muted">Compre, venda e cuide das finanças.</p></div><div class="card"><b>Evolua</b><p class="muted">Transforme o boleiro em estrela.</p></div></div>';return}if(b.dataset.start==='back'){S=null;return render()}if(b.dataset.start==='create'){S=novo({coach:$('#coach').value,club:$('#club').value});return render()}if(b.dataset.v){V=b.dataset.v;return render()}if(b.dataset.act==='play')return openMatch();if(b.dataset.act==='week')return week();if(b.dataset.act==='auto')return autoXI();if(b.dataset.act==='train'){train();return render()}if(b.dataset.act==='scout'){S.market.push(...Array.from({length:5},(_,i)=>p(i,'mercado',66)));S.fin.saldo-=100000;return render()}if(b.dataset.act==='edit'){C().n=$('#edClub').value;S.fin.saldo=Number($('#edMoney').value)||S.fin.saldo;return render()}if(b.dataset.act==='save'){save();return msg('Salvo')}if(b.dataset.act==='export'){$('#savebox').value=JSON.stringify(S,null,2);return}if(b.dataset.act==='import'){try{S=JSON.parse($('#savebox').value);render()}catch(e){msg('Save inválido')}return}if(b.dataset.act==='reset'&&confirm('Resetar?')){localStorage.removeItem(K);S=null;return render()}if(b.dataset.mode){S.modo=b.dataset.mode;return render()}if(b.dataset.buy){let q=S.market.find(x=>x.id===b.dataset.buy);if(S.fin.saldo<q.valor)return msg('Saldo insuficiente');S.fin.saldo-=q.valor;q.team=S.user.club;S.players.push(q);S.market=S.market.filter(x=>x.id!==q.id);return render()}if(b.dataset.sell){let q=S.players.find(x=>x.id===b.dataset.sell);if(q.star)return msg('Não dá para vender o Boleiro');S.fin.saldo+=q.valor;S.players=S.players.filter(x=>x.id!==q.id);return render()}if(b.dataset.renew){let q=S.players.find(x=>x.id===b.dataset.renew);q.contr+=18;q.sal=Math.round(q.sal*1.1);return render()}if(b.dataset.life){let c=S.career;if(b.dataset.life==='rest')c.energia=cl(c.energia+18);if(b.dataset.life==='boot'&&c.grana>=500){c.grana-=500;c.skills.fin=cl(c.skills.fin+2)}if(b.dataset.life==='media')c.fama=cl(c.fama+5);if(b.dataset.life==='night'){c.feliz=cl(c.feliz+12);c.energia=cl(c.energia-16)}return render()}if(b.dataset.close){clearInterval(T);modal.classList.remove('open');return}if(b.dataset.mm&&M){M.mode=b.dataset.mm;drawBox();if(M.mode==='mapa')auto();return}if(b.dataset.m==='finish')return finish();if(b.dataset.lance)return lance(b.dataset.lance)});document.addEventListener('change',e=>{let x=e.target;if(x.dataset.tit){let q=S.players.find(p=>p.id===x.dataset.tit);q.tit=x.checked;if(XI().length>11){q.tit=false;msg('Máximo 11 titulares')}return render()}if(x.dataset.tac){S.tac[x.dataset.tac]=x.value;return render()}if(x.dataset.tr){S.train[x.dataset.tr]=x.value;return render()}if(x.dataset.fin){S.fin[x.dataset.fin]=Number(x.value)||S.fin[x.dataset.fin];save()}});document.addEventListener('input',e=>{let x=e.target;if(x.dataset.range){if(x.dataset.range in S.tac)S.tac[x.dataset.range]=Number(x.value);else S.train[x.dataset.range]=Number(x.value);render()}});document.addEventListener('pointerdown',e=>{let c=e.target.closest('#cv');if(!c||!M||M.mode!=='lances')return;let r=c.getBoundingClientRect();M.ax=cl((e.clientX-r.left)/r.width*100);M.ay=cl((e.clientY-r.top)/r.height*100);drawCanvas()});S=load();render()})();</script></body></html>
