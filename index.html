<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boleiros</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110c;color:#f5fff8;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.app{max-width:1150px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;background:#07110cee;backdrop-filter:blur(10px);z-index:2;padding:10px 0}.brand{display:flex;gap:10px;align-items:center}.crest{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#54e389,#14552e);display:grid;place-items:center;color:#031107;font-weight:900}.brand h1{margin:0}.brand p{margin:0;color:#9db5a8;font-size:12px}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid #315640;background:#102018;border-radius:999px;padding:8px 10px;font-size:12px}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0 14px}.nav button{white-space:nowrap}.on{background:#54e389!important;color:#031107!important;font-weight:900}button,input,select{font:inherit}button{border:1px solid #315640;background:#20392c;color:#f5fff8;border-radius:13px;padding:10px 12px;cursor:pointer}.primary{background:#54e389;color:#031107;font-weight:900}.danger{background:#55232a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#102018;border:1px solid #315640;border-radius:22px;padding:15px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#172b21;border:1px solid #315640;border-radius:16px;padding:12px}.big{font-size:24px;font-weight:900}.muted{color:#9db5a8}.item{background:#0c1a13;border:1px solid #274634;border-radius:14px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #263e31;text-align:left}th{font-size:11px;color:#9db5a8;text-transform:uppercase}.field{height:320px;border:2px solid #ffffff55;border-radius:20px;background:linear-gradient(#238543,#135b2b);position:relative;overflow:hidden}.field:before{content:"";position:absolute;inset:8%;border:2px solid #ffffff55;border-radius:16px}.field:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff55}.dot{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:#54e389;color:#031107;display:grid;place-items:center;font-size:10px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:12px}.modal.on{display:flex}.box{width:min(940px,100%);max-height:92vh;overflow:auto;background:#0c1a13;border:1px solid #315640;border-radius:24px;padding:15px}canvas{width:100%;height:340px;background:#16682f;border-radius:18px;border:1px solid #88c999;touch-action:none}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#f5fff8;color:#031107;border-radius:99px;padding:10px 14px;font-weight:900;display:none}.toast.on{display:block}input,select{width:100%;background:#09150f;color:#f5fff8;border:1px solid #315640;border-radius:12px;padding:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.hud{justify-content:flex-start}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><div class="crest">B</div><div><h1>Boleiros</h1><p>Manager clássico brasileiro com carreira jogável</p></div></div><div id="hud" class="hud"></div></header><nav id="nav" class="nav"></nav><main id="view"></main></div>
<div id="modal" class="modal"><div id="box" class="box"></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const SAVE='boleiros_save';const $=s=>document.querySelector(s);const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const M=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');const P=n=>Math.max(1,Math.min(99,Math.round(n)));let S,T='inicio',J,TM;
window.onerror=(m,u,l)=>{document.body.innerHTML='<div style="padding:24px;color:white;background:#160909;min-height:100vh"><h1>Boleiros quebrou</h1><p>'+m+'</p><p>Linha '+l+'</p><button onclick="localStorage.removeItem(\'boleiros_save\');location.reload()">Limpar save</button></div>'};
const clubes=['Boleiros FC','Vila Esperança','União da Lapa','Real Capoeira','Atlético Mangue','Portuguesa do Norte','Independente de Minas','Ferroviária Sul'];
const nomes='Rafael Bruno Caio Diego Felipe Guto Hugo João Kauã Léo Marcos Neto Otávio Paulo Renan Sandro Thiago Vini Wesley Yuri Zeca'.split(' '),sob='Silva Souza Lima Costa Santos Rocha Moura Ribeiro Alves Gomes Castro Cardoso'.split(' '),pos='GOL ZAG ZAG LE LD VOL MC MEI PE PD ATA ATA ZAG MC MEI ATA'.split(' ');
function player(i,star){let ov=star?70:R(48,76);return{id:'p'+i+Date.now()+Math.random(),nome:star?'João Boleiro':nomes[R(0,nomes.length-1)]+' '+sob[R(0,sob.length-1)],pos:star?'ATA':pos[i%pos.length],idade:star?18:R(17,35),ov,fis:R(60,96),mor:R(55,90),valor:ov*ov*R(550,950),sal:ov*R(420,900),tit:i<11,star}}
function agenda(ts){let a=[],ids=ts.map(t=>t.id);for(let r=0;r<ids.length-1;r++){for(let i=0;i<ids.length/2;i++)a.push({r:r+1,c:ids[i],f:ids[ids.length-1-i],ok:false});ids=[ids[0],ids[ids.length-1],...ids.slice(1,-1)]}return a}
function novo(){let times=clubes.map((n,i)=>({id:'t'+i,n,forca:R(55,78),j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0}));return{v:'0.1-github',sem:1,rod:1,clube:'Boleiros FC',saldo:1800000,torcida:12000,ing:35,pat:250000,times,agenda:agenda(times),elenco:Array.from({length:16},(_,i)=>player(i,i==9)),mercado:Array.from({length:10},(_,i)=>player(i+30,false)),tat:{form:'4-3-3',mental:'Equilibrada',press:'Média',marc:'Zona'},car:{energia:82,feliz:70,fama:8,grana:1500,skills:{finalização:64,passe:57,drible:61,velocidade:66}},not:['Bem-vindo ao Boleiros. Esta é a primeira build no GitHub Pages.'],modo:'mapa'}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE))}catch(e){return null}}function save(){localStorage.setItem(SAVE,JSON.stringify(S))}function me(){return S.times.find(t=>t.n==S.clube)||S.times[0]}function nome(id){return S.times.find(t=>t.id==id)?.n||''}function folha(){return S.elenco.reduce((a,p)=>a+p.sal,0)}function media(){let a=S.elenco.filter(p=>p.tit).slice(0,11);return Math.round(a.reduce((s,p)=>s+p.ov*p.fis/100*p.mor/100,0)/(a.length||1))}function prox(){return S.agenda.find(j=>!j.ok&&(j.c==me().id||j.f==me().id))}function classif(){return [...S.times].sort((a,b)=>b.pts-a.pts||((b.gp-b.gc)-(a.gp-a.gc))||b.gp-a.gp)}
function render(){save();$('#hud').innerHTML='<span class="pill">Semana '+S.sem+'</span><span class="pill">Saldo '+M(S.saldo)+'</span><span class="pill">Força '+media()+'</span><span class="pill">Modo '+(S.modo=='mapa'?'Mini mapa':'Lances')+'</span>';let ns=['inicio','elenco','escalacao','taticas','jogo','mercado','financas','competicoes','carreira','editor'];$('#nav').innerHTML=ns.map(n=>'<button data-go="'+n+'" class="'+(T==n?'on':'')+'">'+lab(n)+'</button>').join('');$('#view').innerHTML=V[T]()}
function lab(n){return{inicio:'Início',elenco:'Elenco',escalacao:'Escalação',taticas:'Táticas',jogo:'Jogo',mercado:'Mercado',financas:'Finanças',competicoes:'Competições',carreira:'Carreira',editor:'Editor'}[n]}
function tabela(lim=99){return '<table><tr><th>#</th><th>Clube</th><th>Pts</th><th>J</th><th>V</th><th>SG</th></tr>'+classif().slice(0,lim).map((t,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+t.n+'</b></td><td>'+t.pts+'</td><td>'+t.j+'</td><td>'+t.v+'</td><td>'+(t.gp-t.gc)+'</td></tr>').join('')+'</table>'}
function jogadores(a,own){return '<table><tr><th></th><th>Jogador</th><th>Pos</th><th>OV</th><th>Fís</th><th>Moral</th><th>Valor</th><th></th></tr>'+a.map(p=>'<tr><td>'+(own?'<input type="checkbox" data-tit="'+p.id+'" '+(p.tit?'checked':'')+'>':'')+'</td><td><b>'+p.nome+'</b>'+(p.star?' ⭐':'')+'</td><td>'+p.pos+'</td><td>'+p.ov+'</td><td>'+p.fis+'</td><td>'+p.mor+'</td><td>'+M(p.valor)+'</td><td>'+(own?'':'<button data-buy="'+p.id+'">Comprar</button>')+'</td></tr>').join('')+'</table>'}
function campo(){let c=[[8,50],[24,25],[24,50],[24,75],[43,20],[43,42],[43,62],[43,82],[66,28],[66,72],[84,50]];return S.elenco.filter(p=>p.tit).slice(0,11).map((p,i)=>'<div class="dot" style="left:'+c[i][0]+'%;top:'+c[i][1]+'%">'+p.pos+'</div>').join('')}
const V={inicio(){let p=prox();return '<div class="grid"><section class="panel"><h2>Painel</h2><div class="cards"><div class="card"><div class="muted">Força</div><div class="big">'+media()+'</div></div><div class="card"><div class="muted">Saldo</div><div class="big">'+M(S.saldo)+'</div></div><div class="card"><div class="muted">Rodada</div><div class="big">'+S.rod+'</div></div><div class="card"><div class="muted">Próximo</div><b>'+(p?nome(p.c)+' x '+nome(p.f):'Fim')+'</b></div></div><br><button class="primary" data-act="match">Jogar próxima partida</button> <button data-act="week">Avançar semana</button><br><br>'+S.not.slice(-4).reverse().map(n=>'<div class="item">'+n+'</div>').join('')+'</section><section class="panel"><h2>Top 6</h2>'+tabela(6)+'</section></div>'},elenco(){return '<section class="panel"><div class="row"><h2>Elenco</h2><button data-act="auto">Escalar melhores</button></div>'+jogadores(S.elenco,true)+'</section>'},escalacao(){return '<div class="grid"><section class="panel"><h2>Campo</h2><div class="field">'+campo()+'</div></section><section class="panel"><h2>Titulares</h2>'+jogadores(S.elenco,true)+'</section></div>'},taticas(){return '<section class="panel"><h2>Táticas</h2><div class="cards">'+['4-4-2','4-3-3','3-5-2','4-2-3-1'].map(f=>'<button data-form="'+f+'" class="'+(S.tat.form==f?'on':'')+'">'+f+'</button>').join('')+'</div><br><button data-mental="Defensiva">Defensiva</button> <button data-mental="Equilibrada">Equilibrada</button> <button data-mental="Ofensiva">Ofensiva</button></section>'},jogo(){return '<section class="panel"><h2>Modo de partida</h2><div class="cards"><div class="card"><h3>Mini mapa automático</h3><p class="muted">Partida roda sozinha com bolinha, placar e narração.</p><button class="primary" data-mode="mapa">Usar mini mapa</button></div><div class="card"><h3>Jogar lances</h3><p class="muted">Você mira e decide lances importantes.</p><button class="primary" data-mode="lances">Usar lances</button></div></div><br><button class="primary" data-act="match">Jogar próxima partida</button></section>'},mercado(){return '<div class="grid"><section class="panel"><h2>Comprar</h2>'+jogadores(S.mercado,false)+'</section><section class="panel"><h2>Vender</h2>'+S.elenco.map(p=>'<div class="item"><span><b>'+p.nome+'</b><br><span class="muted">'+p.pos+' '+p.ov+' • '+M(p.valor)+'</span></span><button data-sell="'+p.id+'">Vender</button></div>').join('')+'</section></div>'},financas(){return '<section class="panel"><h2>Finanças</h2><div class="cards"><div class="card">Saldo<div class="big">'+M(S.saldo)+'</div></div><div class="card">Folha<div class="big">'+M(folha())+'</div></div><div class="card">Patrocínio<div class="big">'+M(S.pat)+'</div></div><div class="card">Ingresso<input id="ing" type="number" value="'+S.ing+'"></div></div></section>'},competicoes(){return '<section class="panel"><h2>Brasileirão Boleiros</h2>'+tabela()+'</section>'},carreira(){let c=S.car;return '<section class="panel"><h2>Carreira</h2><div class="cards"><div class="card">Energia<div class="big">'+c.energia+'</div></div><div class="card">Felicidade<div class="big">'+c.feliz+'</div></div><div class="card">Fama<div class="big">'+c.fama+'</div></div><div class="card">Grana<div class="big">'+M(c.grana)+'</div></div></div><br><button data-life="rest">Descansar</button> <button data-life="boot">Comprar chuteira</button> <button data-life="media">Dar entrevista</button></section>'},editor(){return '<section class="panel"><h2>Editor</h2><label>Clube</label><input id="club" value="'+S.clube+'"><br><br><button class="primary" data-act="edit">Salvar</button> <button class="danger" data-act="reset">Resetar</button></section>'}};
function sim(c,f){let fc=(c==me().id?media():S.times.find(t=>t.id==c).forca)+R(-12,12),ff=(f==me().id?media():S.times.find(t=>t.id==f).forca)+R(-12,12);return [Math.max(0,Math.round((fc-45)/18)+R(0,2)-(ff>fc?1:0)),Math.max(0,Math.round((ff-45)/18)+R(0,2)-(fc>ff?1:0))]}
function res(c,f,gc,gf){let a=S.times.find(t=>t.id==c),b=S.times.find(t=>t.id==f);a.j++;b.j++;a.gp+=gc;a.gc+=gf;b.gp+=gf;b.gc+=gc;if(gc>gf){a.v++;b.d++;a.pts+=3}else if(gf>gc){b.v++;a.d++;b.pts+=3}else{a.e++;b.e++;a.pts++;b.pts++}}
function openMatch(){let j=prox();if(!j)return toast('Temporada encerrada');J={j,min:0,gc:0,gf:0,x:50,y:50,aimX:86,aimY:50,pow:60,log:[],modo:S.modo};$('#modal').classList.add('on');drawMatch();if(J.modo=='mapa')autoMap()}
function drawMatch(){let b=$('#box');b.innerHTML='<div class="row"><h2>'+nome(J.j.c)+' '+J.gc+' x '+J.gf+' '+nome(J.j.f)+'</h2><button data-act="close">Fechar</button></div><p class="muted">'+(J.modo=='mapa'?'Mini mapa automático':'Lances jogáveis')+' • '+J.min+' min</p><canvas id="cv" width="900" height="420"></canvas><br><button data-mmode="mapa">Mini mapa</button> <button data-mmode="lances">Jogar lances</button> <button class="primary" data-act="finish">Encerrar partida</button>'+(J.modo=='lances'?'<div class="panel"><h3>Lance decisivo</h3><p>Clique no campo para mirar.</p><button data-lance="chutar">Chutar</button> <button data-lance="passar">Passe</button> <button data-lance="driblar">Drible</button></div>':'')+'<div class="panel"><h3>Narração</h3>'+(J.log.slice(-6).reverse().map(l=>'<div class="item">'+l+'</div>').join('')||'<p class="muted">A bola vai rolar...</p>')+'</div>';drawCanvas()}
function drawCanvas(){let c=$('#cv');if(!c)return;let x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle='#176b34';x.fillRect(0,0,w,h);x.strokeStyle='#fff9';x.lineWidth=3;x.strokeRect(30,30,w-60,h-60);x.beginPath();x.moveTo(w/2,30);x.lineTo(w/2,h-30);x.stroke();[[15,50],[30,25],[30,70],[55,38],[55,64],[76,50]].forEach((p,i)=>{x.fillStyle=i<3?'#54e389':'#ffd166';x.beginPath();x.arc(p[0]*w/100,p[1]*h/100,12,0,7);x.fill()});x.fillStyle='#fff';x.beginPath();x.arc(J.x*w/100,J.y*h/100,8,0,7);x.fill();if(J.modo=='lances'){x.strokeStyle='#ffd166';x.beginPath();x.moveTo(J.x*w/100,J.y*h/100);x.lineTo(J.aimX*w/100,J.aimY*h/100);x.stroke()}}
function autoMap(){clearInterval(TM);TM=setInterval(()=>{if(!J||J.modo!='mapa'){clearInterval(TM);return}J.min+=R(4,8);J.x=P(J.x+R(-18,18));J.y=P(J.y+R(-22,22));if(Math.random()<.25){if(Math.random()<.45){J.gc++;J.log.push(J.min+'’ GOOOL do '+S.clube+'!')}else if(Math.random()<.35){J.gf++;J.log.push(J.min+'’ Gol adversário.')}else J.log.push(J.min+'’ Chance defendida.')}if(J.min>=90)finish();else drawMatch()},700)}
function lance(a){let pr=.45+S.car.skills.finalização/220-Math.abs(J.aimY-50)/160;if(Math.random()<pr){J.gc++;J.log.push((J.min||R(8,75))+'’ '+a+' perfeito. Gol!')}else J.log.push((J.min||R(8,75))+'’ Tentou '+a+', mas errou.');J.min=Math.min(90,J.min+R(12,25));if(J.min>=90)finish();else drawMatch()}
function finish(){clearInterval(TM);let r=sim(J.j.c,J.j.f),gc=Math.max(J.gc,r[0]),gf=Math.max(J.gf,r[1]);J.j.ok=true;res(J.j.c,J.j.f,gc,gf);S.agenda.filter(j=>!j.ok&&j.r==J.j.r).forEach(j=>{let z=sim(j.c,j.f);j.ok=true;res(j.c,j.f,z[0],z[1])});let renda=Math.round(S.torcida*S.ing*(gc>=gf?.42:.25));S.saldo+=renda+S.pat/4-folha();S.rod++;S.sem++;S.not.push(nome(J.j.c)+' '+gc+' x '+gf+' '+nome(J.j.f)+'. Renda '+M(renda)+'.');J=null;$('#modal').classList.remove('on');render();toast('Partida encerrada')}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){T=b.dataset.go;render()}if(b.dataset.mode){S.modo=b.dataset.mode;render()}if(b.dataset.form){S.tat.form=b.dataset.form;render()}if(b.dataset.mental){S.tat.mental=b.dataset.mental;render()}if(b.dataset.mmode){J.modo=b.dataset.mmode;drawMatch();if(J.modo=='mapa')autoMap()}if(b.dataset.lance)lance(b.dataset.lance);if(b.dataset.buy){let p=S.mercado.find(x=>x.id==b.dataset.buy);if(S.saldo<p.valor)return toast('Saldo insuficiente');S.saldo-=p.valor;S.elenco.push(p);S.mercado=S.mercado.filter(x=>x.id!=p.id);render()}if(b.dataset.sell){let p=S.elenco.find(x=>x.id==b.dataset.sell);if(p.star)return toast('Não dá para vender o boleiro principal');S.saldo+=p.valor;S.elenco=S.elenco.filter(x=>x.id!=p.id);render()}if(b.dataset.life){if(b.dataset.life=='rest')S.car.energia=P(S.car.energia+16);if(b.dataset.life=='boot'){S.car.grana-=500;S.car.skills.finalização=P(S.car.skills.finalização+2)}if(b.dataset.life=='media')S.car.fama+=3;render()}let a=b.dataset.act;if(a=='match')openMatch();if(a=='close'){$('#modal').classList.remove('on');clearInterval(TM)}if(a=='finish')finish();if(a=='week'){S.sem++;S.saldo+=S.pat/4-folha();render()}if(a=='auto'){S.elenco.sort((a,b)=>b.ov-a.ov).forEach((p,i)=>p.tit=i<11);render()}if(a=='edit'){S.clube=$('#club').value||S.clube;me().n=S.clube;render()}if(a=='reset'&&confirm('Resetar o jogo?')){localStorage.removeItem(SAVE);S=novo();render()}});
document.addEventListener('change',e=>{if(e.target.dataset.tit){let p=S.elenco.find(x=>x.id==e.target.dataset.tit);p.tit=e.target.checked;render()}if(e.target.id=='ing'){S.ing=Number(e.target.value)||35;save()}});
document.addEventListener('pointerdown',e=>{let c=e.target.closest('#cv');if(!c||!J||J.modo!='lances')return;let r=c.getBoundingClientRect();J.aimX=P((e.clientX-r.left)/r.width*100);J.aimY=P((e.clientY-r.top)/r.height*100);drawCanvas()});
S=load()||novo();render();
</script>
</body>
</html>
