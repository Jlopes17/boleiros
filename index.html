function st(){return{j:0,v:0,e:0,d:0,gp:0,gc:0,sg:0,pts:0}}function player(i,team,lvl=62,star=false){let idade=star?18:rnd(17,36),ov=star?72:cl(lvl+rnd(-14,14),35,91),pot=cl(ov+rnd(idade<23?6:0,idade<24?20:8),ov,99);let p={id:'p'+Math.random().toString(36).slice(2),nome:star?'Léo Boleiro':pick(first)+' '+pick(last),pos:star?'ATA':pos[i%pos.length],idade,ov,pot,fis:rnd(64,100),mor:rnd(48,92),forma:rnd(48,88),sal:Math.round(ov*ov*rnd(15,25)),contr:rnd(8,36),les:0,susp:0,tit:i<11,team,star,gols:0,ass:0};p.valor=Math.round(ov*ov*(pot/75)*(idade<23?1.25:idade>31?.72:1)*850);return p}

function layout(){return `<div class='shell'><aside class='side'><div class='brand'><div class='logo'>B</div><div><h2>Boleiros</h2><p class='mut'>${safe(club().n)} • T${S.season}</p></div></div><nav class='nav'>${nav.map(([id,l,s])=>`<button data-view='${id}' class='${V===id?'on':''}'><span>${l}</span><small>${s}</small></button>`).join('')}</nav></aside><main class='main'><div class='row'><div><h1>${title()}</h1><p class='mut'>${sub()}</p></div><div class='hud'><span class='pill'>Semana ${S.week}</span><span class='pill'>${money(S.finance.saldo)}</span><span class='pill'>Força ${strength()}</span><span class='pill'>${position()}º</span></div></div>${pages[V]()}<nav class='bottom'>${[['painel','Painel'],['elenco','Elenco'],['partida','Jogo'],['competicoes','Torneios'],['tabela','Tabela']].map(([id,l])=>`<button data-view='${id}' class='${V===id?'on':''}'>${l}</button>`).join('')}</nav></main></div>`}
function title(){return{painel:'Painel da semana',agenda:'Agenda',elenco:'Elenco',escala:'Escalação',taticas:'Táticas',treino:'Treino',partida:'Central da partida',mercado:'Mercado',financas:'Finanças',competicoes:'Competições',tabela:'Tabela',carreira:'Carreira do boleiro',config:'Configurações'}[V]||'Boleiros'}function sub(){return{painel:'Prepare o time antes da bola rolar.',competicoes:'Base sul-americana e torneios disponíveis.',partida:'Escolha como jogar a partida.'}[V]||''}
function nextCard(){let j=next();if(!j)return `<div class='item'><b>Temporada encerrada</b><span class='mut'>Em breve: novas temporadas completas.</span></div>`;let opp=j.h===S.user.club?j.a:j.h;return `<div class='card'><div class='row'><div><span class='tag warn'>Próxima partida</span><h2>${club(j.h).n} x ${club(j.a).n}</h2><p class='mut'>${j.comp} • rodada ${j.rod} • adversário força ${strength(opp)}</p></div><button class='pri' data-action='match'>Jogar</button></div><div class='g3'><div>Nossa força<div class='big'>${strength()}</div></div><div>Oponente<div class='big'>${strength(opp)}</div></div><div>Modo<div class='big'>${modeName(S.mode)}</div></div></div></div>`}
function modeName(m){return m==='momentos'?'Momentos':m==='tecnico'?'Técnico':'Completo'}function table(l=99){let arr=standings();return `<div class='table'><table><tr><th>#</th><th>Clube</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${arr.slice(0,l).map((t,i)=>`<tr><td>${i+1}</td><td><b>${t.n}</b>${t.id===S.user.club?` <span class='tag ok'>Você</span>`:''}</td><td><b>${t.st.pts}</b></td><td>${t.st.j}</td><td>${t.st.v}</td><td>${t.st.e}</td><td>${t.st.d}</td><td>${t.st.sg}</td></tr>`).join('')}</table></div>`}function fixture(j){return `<div class='item'><div><b>${club(j.h).n}</b> ${j.ok?j.gh:'-'} x ${j.ok?j.ga:'-'} <b>${club(j.a).n}</b><br><span class='mut'>${j.comp} • Rodada ${j.rod}</span></div>${!j.ok&&(j.h===S.user.club||j.a===S.user.club)?`<button class='pri' data-action='match'>Jogar</button>`:''}</div>`}
function rows(ps,own=true){return `<div class='table'><table><tr><th></th><th>Jogador</th><th>Pos</th><th>OV</th><th>Pot</th><th>Fís</th><th>Moral</th><th>Valor</th><th>Ação</th></tr>${ps.map(p=>`<tr><td>${own?`<input type='checkbox' data-tit='${p.id}' ${p.tit?'checked':''} ${p.les||p.susp?'disabled':''}>`:''}</td><td><b>${safe(p.nome)}</b>${p.star?' ⭐':''}<br><span class='mut'>${p.idade} anos</span></td><td>${p.pos}</td><td><b>${p.ov}</b></td><td>${p.pot}</td><td>${p.fis}</td><td>${p.mor}</td><td>${money(p.valor)}</td><td>${own?`<button data-player='${p.id}'>Detalhes</button>`:`<button class='pri' data-buy='${p.id}'>Comprar</button>`}</td></tr>`).join('')}</table></div>`}
const xy=[[8,50],[24,22],[24,43],[24,58],[24,78],[44,32],[44,52],[44,72],[70,25],[83,50],[70,75]];function pitch(){return `<div class='field'>${xi().map((p,i)=>`<div class='dot ${p.star?'star':''}' style='left:${xy[i]?.[0]||50}%;top:${xy[i]?.[1]||50}%'>${p.pos}</div>`).join('')}</div>`}function slider(k,l,v,s){return `<div><label>${l}</label><input type='range' min='0' max='100' value='${v}' data-slider='${k}' data-scope='${s}'><div class='row'><span class='mut'>baixo</span><b>${v}</b><span class='mut'>alto</span></div></div>`}
function compsView(){let c=competitionsFor(S.user.club),cards=[['Estadual '+club().state,c.state.length+' clubes locais','Formato inicial: turno curto regional.'],['Brasileirão Boleiros Série '+divLabel(club().div),c.league.length+' clubes','Pontos corridos da divisão atual.'],['Libertadores Boleiros',c.lib.length+' clubes','Elite sul-americana fictícia.'],['Sul-Americana Boleiros',c.sula.length+' clubes','Copa continental secundária.'],['Copa do Mundo','Países reais','Seleções podem usar nomes de países reais.']];return `<section class='panel'><div class='tabs'>${['ligas','estaduais','continentais','mundial','database'].map(t=>`<button data-tab='${t}' class='${TAB===t?'on':''}'>${t}</button>`).join('')}</div>${TAB==='database'?dbView():TAB==='mundial'?worldView():TAB==='continentais'?contView(c):TAB==='estaduais'?stateView():`<div class='g3'>${cards.map(x=>`<div class='card'><h3>${x[0]}</h3><p class='big'>${x[1]}</p><p class='mut'>${x[2]}</p></div>`).join('')}</div>`}</section>`}
function dbView(){return `<h2>Base sul-americana fictícia</h2><p class='mut'>Clubes reais foram evitados. Os nomes são alterados e sem escudos oficiais.</p><div class='table'><table><tr><th>Clube</th><th>País</th><th>Região</th><th>Div</th><th>Força</th></tr>${TEAM_DB.map(t=>`<tr><td><b>${t.n}</b></td><td>${t.country}</td><td>${t.state}</td><td>${t.div?`Série ${divLabel(t.div)}`:'Continental'}</td><td>${t.rep}</td></tr>`).join('')}</table></div>`}function stateView(){let groups=[...new Set(TEAM_DB.filter(t=>t.country==='Brasil').map(t=>t.state))];return `<h2>Estaduais / regionais</h2><div class='g3'>${groups.map(g=>`<div class='card'><h3>${g}</h3><p>${TEAM_DB.filter(t=>t.state===g).map(t=>t.n).join(', ')}</p></div>`).join('')}</div>`}function contView(c){let top=TEAM_DB.filter(t=>c.lib.includes(t.id)||c.sula.includes(t.id));return `<h2>Copas continentais</h2><div class='grid'><div class='card'><h3>Libertadores Boleiros</h3><p>${c.lib.map(id=>TEAM_DB.find(t=>t.id===id).n).join(', ')}</p></div><div class='card'><h3>Sul-Americana Boleiros</h3><p>${c.sula.map(id=>TEAM_DB.find(t=>t.id===id).n).join(', ')}</p></div></div>`}function worldView(){return `<h2>Copa do Mundo</h2><p class='mut'>Aqui podemos usar nomes de países. Jogadores continuam fictícios.</p><div class='g4'>${COUNTRIES.map(c=>`<div class='card'><b>${c}</b><p class='mut'>Seleção nacional</p></div>`).join('')}</div>`}
const pages={painel(){return `<div class='grid'><section class='panel'><div class='row'><h2>Resumo</h2><button class='pri' data-action='match'>Jogar próxima</button></div><div class='g4'><div class='card'>Posição<div class='big'>${position()}º</div></div><div class='card'>Força<div class='big'>${strength()}</div></div><div class='card'>Folha<div class='big'>${money(wage())}</div></div><div class='card'>Fase<div class='big'>${S.phase}</div></div></div><br>${nextCard()}</section><section class='panel'><h2>Notícias</h2><div class='stack'>${S.news.slice(-7).reverse().map(n=>`<div class='item'>${safe(n)}</div>`).join('')}</div><br><div class='disc'>${DISC}</div></section></div><br><section class='panel'><h2>Top da divisão</h2>${table(6)}</section>`},agenda(){return `<div class='grid'><section class='panel'><h2>Próximos jogos</h2><div class='stack'>${S.calendar.filter(j=>!j.ok&&(j.h===S.user.club||j.a===S.user.club)).slice(0,10).map(fixture).join('')}</div></section><section class='panel'><h2>Rodada atual</h2><div class='stack'>${round().map(fixture).join('')||'<p class=mut>Rodada concluída.</p>'}</div></section></div>`},elenco(){let ps=squad().filter(p=>S.filters.pos==='Todos'||p.pos===S.filters.pos).sort((a,b)=>Number(b.tit)-Number(a.tit)||b.ov-a.ov);return `<section class='panel'><div class='row'><h2>Elenco</h2><div><select style='width:auto' data-filter='pos'><option>Todos</option>${['GOL','ZAG','LE','LD','VOL','MC','MEI','PE','PD','ATA'].map(x=>`<option ${S.filters.pos===x?'selected':''}>${x}</option>`).join('')}</select> <button data-action='auto'>Escalar melhores</button></div></div>${rows(ps,true)}</section>`},escala(){return `<div class='grid'><section class='panel'><h2>Campo</h2>${pitch()}</section><section class='panel'><h2>Onze inicial</h2>${rows(xi(),true)}</section></div>`},taticas(){return `<section class='panel'><h2>Plano de jogo</h2><div class='g3'><div><label>Formação</label><select data-tac='form'>${['4-3-3','4-4-2','4-2-3-1','3-5-2','5-3-2'].map(x=>`<option ${S.tac.form===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Mentalidade</label><select data-tac='men'>${['Defensiva','Equilibrada','Ofensiva'].map(x=>`<option ${S.tac.men===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Pressão</label><select data-tac='press'>${['Baixa','Média','Alta'].map(x=>`<option ${S.tac.press===x?'selected':''}>${x}</option>`).join('')}</select></div>${slider('ritmo','Ritmo',S.tac.ritmo,'tac')}${slider('risco','Risco',S.tac.risco,'tac')}${slider('linha','Linha defensiva',S.tac.linha,'tac')}</div></section>`},treino(){return `<section class='panel'><h2>Treino da semana</h2><div class='g3'><div><label>Foco coletivo</label><select data-train='focus'>${['Equilibrado','Finalização','Defesa','Físico','Posse de bola'].map(x=>`<option ${S.training.focus===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Foco do boleiro</label><select data-train='individual'>${['Ataque','Passe','Drible','Velocidade','Defesa'].map(x=>`<option ${S.training.individual===x?'selected':''}>${x}</option>`).join('')}</select></div>${slider('intensity','Intensidade',S.training.intensity,'train')}${slider('rest','Descanso',S.training.rest,'train')}</div><br><button class='pri' data-action='train'>Aplicar treino</button></section>`},partida(){return `<section class='panel'><h2>Central da partida</h2>${nextCard()}<br><div class='g3'>${['momentos','tecnico','completo'].map(m=>`<div class='card modecard ${S.mode===m?'on':''}' data-mode='${m}'><h3>${modeName(m)}</h3><p class='mut'>${m==='momentos'?'Decida lances-chave.':m==='tecnico'?'Simule e altere tática/substituições.':'Jogue em visão superior.'}</p><button class='${S.mode===m?'pri':''}' data-mode='${m}'>Selecionar</button></div>`).join('')}</div><br><button class='pri' data-action='match'>Começar partida</button></section>`},mercado(){return `<div class='grid'><section class='panel'><div class='row'><h2>Comprar</h2><button data-action='scout'>Buscar jogadores</button></div>${rows(S.market.sort((a,b)=>b.ov-a.ov),false)}</section><section class='panel'><h2>Vender e renovar</h2><div class='stack'>${squad().sort((a,b)=>b.valor-a.valor).map(p=>`<div class='item'><div><b>${p.nome}</b>${p.star?' ⭐':''}<br><span class='mut'>${p.pos} ${p.ov} • contrato ${p.contr} meses • ${money(p.valor)}</span></div><div><button data-renew='${p.id}'>Renovar</button> <button class='bad' data-sell='${p.id}'>Vender</button></div></div>`).join('')}</div></section></div>`},financas(){return `<section class='panel'><h2>Finanças</h2><div class='g4'><div class='card'>Saldo<div class='big'>${money(S.finance.saldo)}</div></div><div class='card'>Folha semanal<div class='big'>${money(wage()/2)}</div></div><div class='card'>Patrocínio<div class='big'>${money(S.finance.sponsor)}</div></div><div class='card'><label>Ingresso</label><input type='number' data-fin='ticket' value='${S.finance.ticket}'></div></div></section>`},competicoes(){return compsView()},tabela(){return `<section class='panel'><h2>Brasileirão Boleiros Série ${divLabel(club().div)}</h2>${table()}</section>`},carreira(){let c=S.career;return `<section class='panel'><h2>${c.nome}</h2><div class='g4'><div class='card'>Energia<div class='big'>${c.energia}</div></div><div class='card'>Fama<div class='big'>${c.fama}</div></div><div class='card'>Grana<div class='big'>${money(c.grana)}</div></div><div class='card'>Jogos<div class='big'>${c.jogos}</div></div></div><br><div class='grid'><div class='card'><h3>Habilidades</h3>${Object.entries(c.skills).map(([k,v])=>`<div class='item'><span>${k}</span><div style='width:160px'><div class='bar'><span style='width:${v}%'></span></div></div></div>`).join('')}</div><div class='card'><h3>Vida fora de campo</h3><button data-life='rest'>Descansar</button> <button data-life='boot'>Comprar chuteira</button> <button data-life='media'>Dar entrevista</button> <button data-life='night'>Sair à noite</button></div></div></section>`},config(){return `<section class='panel'><h2>Configurações</h2><button class='pri' data-action='save'>Salvar</button> <button data-action='export'>Exportar</button> <button data-action='import'>Importar</button> <button class='bad' data-action='reset'>Resetar</button><br><br><textarea id='saveBox' rows='10' placeholder='Exportar ou colar save aqui'></textarea><br><br><div class='disc'>${DISC}</div></section>`}};
function openPlayer(id){let p=S.players.find(x=>x.id===id);modal.classList.add('open');box.innerHTML=`<div class='row'><div><h2>${p.nome} ${p.star?'⭐':''}</h2><p class='mut'>${p.pos} • ${p.idade} anos • contrato ${p.contr} meses</p></div><button data-close='1'>Fechar</button></div><div class='g4'><div class='card'>OV<div class='big'>${p.ov}</div></div><div class='card'>Potencial<div class='big'>${p.pot}</div></div><div class='card'>Físico<div class='big'>${p.fis}</div></div><div class='card'>Moral<div class='big'>${p.mor}</div></div></div>`}
function openMatch(){let j=next();if(!j){msg('Sem partida pendente');return}clearInterval(TIMER);cancelAnimationFrame(RAF);MATCH={id:j.id,min:0,gh:0,ga:0,x:50,y:50,ax:85,ay:50,log:['A bola vai rolar.'],mode:S.mode,chances:0,paused:false,boost:0,full:null};modal.classList.add('open');matchBox();if(MATCH.mode==='tecnico')startCoach();if(MATCH.mode==='completo')startFull()}
function matchBox(){let j=S.calendar.find(x=>x.id===MATCH.id);box.innerHTML=`<div class='row'><h2>${club(j.h).n} ${MATCH.gh} x ${MATCH.ga} ${club(j.a).n}</h2><button data-close='1'>Fechar</button></div><div class='timeline'>${Array.from({length:10},(_,i)=>`<span class='${MATCH.min>=i*9?'on':''}'></span>`).join('')}</div><p class='mut'>${Math.floor(MATCH.min)}' • ${modeName(MATCH.mode)}</p><canvas id='cv' width='980' height='430'></canvas><br>${matchControls()}<section class='panel'><h3>Narração</h3><div class='stack'>${MATCH.log.slice(-7).reverse().map(l=>`<div class='item'>${safe(l)}</div>`).join('')}</div></section>`;draw()}
function matchControls(){let top=`<button data-mm='momentos' class='${MATCH.mode==='momentos'?'pri':''}'>Momentos</button> <button data-mm='tecnico' class='${MATCH.mode==='tecnico'?'pri':''}'>Técnico</button> <button data-mm='completo' class='${MATCH.mode==='completo'?'pri':''}'>Completo</button> <button data-match='pause'>${MATCH.paused?'Continuar':'Pausar'}</button> <button class='pri' data-match='finish'>Encerrar</button>`;if(MATCH.mode==='momentos')return top+`<div class='card'><h3>Lance do Boleiro</h3><p class='mut'>Toque no campo para mirar.</p><button class='pri' data-lance='chutar'>Chutar</button> <button data-lance='passar'>Passe</button> <button data-lance='driblar'>Drible</button> <button data-lance='defender'>Defender</button></div>`;if(MATCH.mode==='tecnico')return top+`<div class='card'><h3>Área técnica</h3><button data-coach='Ofensiva'>Ofensiva</button> <button data-coach='Equilibrada'>Equilibrada</button> <button data-coach='Defensiva'>Defensiva</button> <button data-coach='sub'>Substituir cansado</button></div>`;return top+`<div class='touch'><div class='dpad'><span></span><button data-hold='up'>▲</button><span></span><button data-hold='left'>◀</button><button data-hold='down'>▼</button><button data-hold='right'>▶</button><span></span><button data-hold='down'>▼</button><span></span></div><div class='actBtns'><button class='pri' data-full='shoot'>Chutar</button><button data-full='pass'>Passe</button><button data-full='cross'>Cruzamento</button><button data-full='tackle'>Carrinho</button></div></div>`}
function draw(){let c=$('#cv');if(!c||!MATCH)return;let x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle='#176b34';x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=3;x.strokeRect(35,35,w-70,h-70);x.beginPath();x.moveTo(w/2,35);x.lineTo(w/2,h-35);x.stroke();x.beginPath();x.arc(w/2,h/2,58,0,7);x.stroke();if(MATCH.mode==='completo'&&MATCH.full){drawFull(x,w,h);return}[[13,50],[26,25],[26,50],[26,75],[48,30],[48,70],[67,26],[81,50],[67,74]].forEach((p,i)=>{x.fillStyle=i<6?'#dfffe8':'#ffd166';x.beginPath();x.arc(p[0]*w/100,p[1]*h/100,13,0,7);x.fill()});x.fillStyle='#fff';x.beginPath();x.arc(MATCH.x*w/100,MATCH.y*h/100,8,0,7);x.fill();if(MATCH.mode==='momentos'){x.strokeStyle='#ffef9b';x.lineWidth=4;x.beginPath();x.moveTo(MATCH.x*w/100,MATCH.y*h/100);x.lineTo(MATCH.ax*w/100,MATCH.ay*h/100);x.stroke()}}
function startCoach(){clearInterval(TIMER);TIMER=setInterval(()=>{if(!MATCH||MATCH.mode!=='tecnico'||MATCH.paused)return;MATCH.min+=rnd(3,6);MATCH.x=cl(MATCH.x+rnd(-18,18),5,95);MATCH.y=cl(MATCH.y+rnd(-22,22),8,92);let j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club,adv=home?j.a:j.h,chance=.22+(strength(S.user.club)+MATCH.boost-strength(adv))/260;if(Math.random()<.38){if(Math.random()<chance){home?MATCH.gh++:MATCH.ga++;MATCH.log.push(`${MATCH.min}' GOOOL do ${club().n}!`)}else if(Math.random()<.36){home?MATCH.ga++:MATCH.gh++;MATCH.log.push(`${MATCH.min}' Gol do adversário.`)}else MATCH.log.push(`${MATCH.min}' Ajuste tático segurou uma chance perigosa.`)}if(MATCH.min>=90)finish();else matchBox()},750)}
function lance(a){let c=S.career,j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club,base=.4+c.skills.Finalização/240+c.energia/650-Math.abs(MATCH.ay-50)/180;if(a==='passar')base=.42+c.skills.Passe/230;if(a==='driblar')base=.35+c.skills.Drible/230;if(a==='defender')base=.42+c.skills.Defesa/220;let ok=Math.random()<base;MATCH.min=cl(MATCH.min+rnd(8,17),1,90);if(ok){if(a==='defender')MATCH.log.push(`${MATCH.min}' Defesa decisiva do Boleiro.`);else{home?MATCH.gh++:MATCH.ga++;c.gols++;c.fama=cl(c.fama+3);MATCH.log.push(`${MATCH.min}' Lance perfeito. Gol do Boleiro!`)}}else{if(a==='defender'){home?MATCH.ga++:MATCH.gh++;MATCH.log.push(`${MATCH.min}' Não conseguiu cortar. Gol deles.`)}else MATCH.log.push(`${MATCH.min}' Tentou ${a}, mas errou.`)}c.energia=cl(c.energia-rnd(3,8));MATCH.chances++;if(MATCH.min>=90||MATCH.chances>=7)finish();else matchBox()}
function startFull(){MATCH.full={px:22,py:50,bx:24,by:50,poss:'user',ai:0};loopFull()}function drawFull(ctx,w,h){let f=MATCH.full;[[18,22,'A'],[18,78,'A'],[42,35,'M'],[42,65,'M'],[70,28,'P'],[70,72,'P'],[78,50,'D'],[58,45,'D']].forEach((p,i)=>{ctx.fillStyle=i<6?'#dfffe8':'#ffd166';ctx.beginPath();ctx.arc(p[0]*w/100,p[1]*h/100,12,0,7);ctx.fill();ctx.fillStyle='#06110b';ctx.font='11px system-ui';ctx.fillText(p[2],p[0]*w/100-4,p[1]*h/100+4)});ctx.fillStyle='#55e58f';ctx.beginPath();ctx.arc(f.px*w/100,f.py*h/100,16,0,7);ctx.fill();ctx.fillStyle='#06110b';ctx.font='bold 12px system-ui';ctx.fillText('EU',f.px*w/100-8,f.py*h/100+4);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.bx*w/100,f.by*h/100,8,0,7);ctx.fill()}
function loopFull(){if(!MATCH||MATCH.mode!=='completo')return;if(!MATCH.paused){let f=MATCH.full,sp=.55+S.career.skills.Velocidade/300;if(keys.left||keys.ArrowLeft||keys.a)f.px-=sp;if(keys.right||keys.ArrowRight||keys.d)f.px+=sp;if(keys.up||keys.ArrowUp||keys.w)f.py-=sp;if(keys.down||keys.ArrowDown||keys.s)f.py+=sp;f.px=cl(f.px,5,95);f.py=cl(f.py,8,92);if(f.poss==='user'){f.bx=f.px+2;f.by=f.py}else{f.ai++;f.bx=cl(f.bx+(Math.random()-.45)*1.8,5,95);f.by=cl(f.by+(Math.random()-.5)*2.2,8,92);if(f.ai%90===0){let j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club;if(Math.random()<.33){home?MATCH.ga++:MATCH.gh++;MATCH.log.push(`${Math.floor(MATCH.min)}' O adversário marcou.`)}else{MATCH.log.push(`${Math.floor(MATCH.min)}' Você recompôs e roubou a bola.`);f.poss='user'}}}MATCH.min+=.025;if(MATCH.min>=90)finish()}draw();RAF=requestAnimationFrame(loopFull)}
function fullAction(a){if(!MATCH||MATCH.mode!=='completo')return;let f=MATCH.full,c=S.career,j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club;if(a==='tackle'){f.poss='user';MATCH.log.push(`${Math.floor(MATCH.min)}' Carrinho limpo. Bola nossa.`);matchBox();return}if(f.poss!=='user'){msg('Sem a bola.');return}let chance=.35;if(a==='shoot'){chance=.25+c.skills.Finalização/170+(f.px>70?.18:0)-Math.abs(f.py-50)/170;if(Math.random()<chance){home?MATCH.gh++:MATCH.ga++;MATCH.log.push(`${Math.floor(MATCH.min)}' Chute forte. GOOOL!`)}else MATCH.log.push(`${Math.floor(MATCH.min)}' Chute para fora.`);f.poss='opp'}if(a==='pass'){chance=.5+c.skills.Passe/220;if(Math.random()<chance){MATCH.log.push(`${Math.floor(MATCH.min)}' Passe quebrando linhas.`);f.px=cl(f.px+12,5,92);f.bx=f.px}else{MATCH.log.push(`${Math.floor(MATCH.min)}' Passe interceptado.`);f.poss='opp'}}if(a==='cross'){chance=.34+c.skills.Passe/260+(f.py<25||f.py>75?.22:-.05);if(Math.random()<chance){home?MATCH.gh++:MATCH.ga++;MATCH.log.push(`${Math.floor(MATCH.min)}' Cruzamento na medida. Gol!`)}else MATCH.log.push(`${Math.floor(MATCH.min)}' Cruzamento cortado.`);f.poss='opp'}c.energia=cl(c.energia-2);matchBox()}
function finish(){clearInterval(TIMER);cancelAnimationFrame(RAF);let j=S.calendar.find(x=>x.id===MATCH.id),base=score(j.h,j.a),gh=Math.max(MATCH.gh,base[0]),ga=Math.max(MATCH.ga,base[1]);apply(j,gh,ga);round().filter(x=>!x.ok&&x.id!==j.id).forEach(x=>{let s=score(x.h,x.a);apply(x,s[0],s[1])});let home=j.h===S.user.club,gf=home?gh:ga,gc=home?ga:gh,win=gf>gc,drawn=gf===gc,renda=home?Math.round(club().tor*S.finance.ticket*(win?.48:drawn?.38:.28)):0,weekly=Math.round(S.finance.sponsor/6+S.finance.merch/8-wage()/2+renda);S.finance.saldo+=weekly;S.career.jogos++;S.last={text:`${club(j.h).n} ${gh} x ${ga} ${club(j.a).n}`,renda,weekly};S.news.push(`${S.last.text}. Saldo da semana: ${money(weekly)}.`);train(true);S.week++;S.phase='pós-jogo';MATCH=null;box.innerHTML=`<div class='row'><h2>Pós-jogo</h2><button data-close='1'>Fechar</button></div><div class='score'>${S.last.text}</div><div class='g3'><div class='card'>Renda<div class='big'>${money(renda)}</div></div><div class='card'>Saldo semana<div class='big'>${money(weekly)}</div></div><div class='card'>Posição<div class='big'>${position()}º</div></div></div><br><button class='pri' data-close='1'>Continuar</button>`;render()}
function train(silent=false){let int=S.training.intensity,rest=S.training.rest;squad().forEach(p=>{let dev=(int-45)/18+(club().ct-1)*.25+rnd(-1,2);if(p.idade<24&&Math.random()<.28)p.ov=cl(p.ov+Math.max(0,dev),1,p.pot);p.forma=cl(p.forma+(int-45)/20+rnd(-2,3));p.fis=cl(p.fis-int/26+rest/20);if(p.les)p.les--;if(Math.random()<Math.max(0,(int-76)/520)/(club().med*.7))p.les=rnd(1,4)});S.plan.training=true;if(!silent)msg('Treino aplicado')}function auto(){squad().forEach(p=>p.tit=false);squad().filter(p=>!p.les&&!p.susp).sort((a,b)=>b.ov-a.ov).slice(0,11).forEach(p=>p.tit=true);S.plan.lineup=true;render()}function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
document.addEventListener('click',e=>{let b=e.target.closest('button,.modecard');if(!b)return;let d=b.dataset;if(d.hardReset){localStorage.clear();location.reload()}if(d.start==='new'){setup();return}if(d.start==='cont'){S=load();render();return}if(d.start==='demo'){S=newGame();render();return}if(d.start==='back'){S=null;render();return}if(d.start==='create'){S=newGame({coach:$('#coach').value,club:$('#clubSelect').value,difficulty:$('#difficulty').value});render();return}if(d.start==='how'){modal.classList.add('open');box.innerHTML=`<div class='row'><h2>Como jogar</h2><button data-close='1'>Fechar</button></div><div class='grid'><div class='card'><h3>1. Prepare</h3><p class='mut'>Treino, escalação, tática e mercado.</p></div><div class='card'><h3>2. Escolha modo</h3><p class='mut'>Momentos, técnico ou jogo completo.</p></div><div class='card'><h3>3. Torneios</h3><p class='mut'>Estadual, Brasileirão e continentais fictícios.</p></div><div class='card'><h3>4. Continue</h3><p class='mut'>Seu save fica no navegador.</p></div></div><br><div class='disc'>${DISC}</div>`;return}if(d.view){V=d.view;render();return}if(d.tab){TAB=d.tab;render();return}if(d.action==='match'){openMatch();return}if(d.action==='auto'){auto();return}if(d.action==='train'){train();render();return}if(d.action==='scout'){S.market.push(...Array.from({length:6},(_,i)=>player(i,'market',rnd(56,82))));S.finance.saldo-=120000;render();return}if(d.action==='save'){save();msg('Salvo');return}if(d.action==='export'){$('#saveBox').value=JSON.stringify(S,null,2);return}if(d.action==='import'){try{S=migrate(JSON.parse($('#saveBox').value));save();render()}catch(err){msg('Save inválido')}return}if(d.action==='reset'&&confirm('Resetar jogo?')){localStorage.removeItem(SAVE);S=null;render();return}if(d.mode){S.mode=d.mode;if(!MATCH)render();return}if(d.player){openPlayer(d.player);return}if(d.buy){let p=S.market.find(x=>x.id===d.buy);if(!p||S.finance.saldo<p.valor){msg('Saldo insuficiente');return}S.finance.saldo-=p.valor;p.team=S.user.club;S.players.push(p);S.market=S.market.filter(x=>x.id!==p.id);render();return}if(d.sell){let p=S.players.find(x=>x.id===d.sell);if(!p)return;if(p.star){msg('Não dá para vender o Boleiro');return}S.finance.saldo+=p.valor;S.players=S.players.filter(x=>x.id!==p.id);render();return}if(d.renew){let p=S.players.find(x=>x.id===d.renew);if(p){p.contr+=18;p.sal=Math.round(p.sal*1.12);msg('Contrato renovado');render()}return}if(d.life){let c=S.career;if(d.life==='rest')c.energia=cl(c.energia+18);if(d.life==='boot'){if(c.grana<500){msg('Grana insuficiente');return}c.grana-=500;c.skills.Finalização=cl(c.skills.Finalização+2)}if(d.life==='media'){c.fama=cl(c.fama+4)}if(d.life==='night'){c.feliz=cl((c.feliz||70)+12);c.energia=cl(c.energia-16)}render();return}if(d.close){clearInterval(TIMER);cancelAnimationFrame(RAF);modal.classList.remove('open');render();return}if(d.mm&&MATCH){clearInterval(TIMER);cancelAnimationFrame(RAF);MATCH.mode=d.mm;MATCH.full=null;matchBox();if(MATCH.mode==='tecnico')startCoach();if(MATCH.mode==='completo')startFull();return}if(d.match==='pause'&&MATCH){MATCH.paused=!MATCH.paused;matchBox();return}if(d.match==='finish'&&MATCH){finish();return}if(d.lance&&MATCH){lance(d.lance);return}if(d.coach&&MATCH){if(d.coach==='sub'){MATCH.boost+=2;MATCH.log.push(`${MATCH.min}' Substituição feita. Time ganhou fôlego.`)}else{S.tac.men=d.coach;MATCH.log.push(`${MATCH.min}' Técnico mudou para ${d.coach}.`)}matchBox();return}if(d.full){fullAction(d.full);return}});
document.addEventListener('change',e=>{let x=e.target;if(!S)return;if(x.dataset.tit){let p=S.players.find(p=>p.id===x.dataset.tit);p.tit=x.checked;if(xi().length>11){p.tit=false;msg('Máximo de 11 titulares')}render();return}if(x.dataset.tac){S.tac[x.dataset.tac]=x.value;render();return}if(x.dataset.train){S.training[x.dataset.train]=x.value;render();return}if(x.dataset.filter==='pos'){S.filters.pos=x.value;render();return}if(x.dataset.fin){S.finance[x.dataset.fin]=Number(x.value)||S.finance[x.dataset.fin];save();return}});document.addEventListener('input',e=>{let x=e.target;if(!S||!x.dataset.slider)return;let sc=x.dataset.scope,k=x.dataset.slider;if(sc==='tac')S.tac[k]=Number(x.value);else S.training[k]=Number(x.value);render()});document.addEventListener('pointerdown',e=>{let h=e.target.closest('[data-hold]');if(h){keys[h.dataset.hold]=true;return}let c=e.target.closest('#cv');if(!c||!MATCH)return;let r=c.getBoundingClientRect(),px=cl((e.clientX-r.left)/r.width*100),py=cl((e.clientY-r.top)/r.height*100);if(MATCH.mode==='momentos'){MATCH.ax=px;MATCH.ay=py;draw()}if(MATCH.mode==='completo'&&MATCH.full){MATCH.full.px=px;MATCH.full.py=py;draw()}});document.addEventListener('pointerup',e=>{let h=e.target.closest('[data-hold]');if(h)keys[h.dataset.hold]=false});document.addEventListener('pointercancel',()=>{keys={}});document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='j')fullAction('shoot');if(e.key==='k')fullAction('pass');if(e.key==='l')fullAction('cross');if(e.key==='i')fullAction('tackle')});document.addEventListener('keyup',e=>{keys[e.key]=false});
S=load();render();
})();
