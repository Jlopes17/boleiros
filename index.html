ase=.4+c.skills.Finalização/240+c.energia/650-Math.abs(M.ay-50)/180;if(a==='passar')base=.42+c.skills.Passe/230;if(a==='driblar')base=.35+c.skills.Drible/230;if(a==='defender')base=.42+c.skills.Defesa/220;let ok=Math.random()<base;M.min=cl(M.min+R(8,17),1,90);if(ok){if(a==='defender')M.log.push(`${M.min}' Defesa decisiva.`);else{home?M.gh++:M.ga++;c.gols++;M.log.push(`${M.min}' Lance perfeito. Gol!`)}}else{if(a==='defender'){home?M.ga++:M.gh++;M.log.push(`${M.min}' Não conseguiu cortar. Gol deles.`)}else M.log.push(`${M.min}' Tentou ${a}, mas errou.`)}c.energia=cl(c.energia-R(3,8));M.chances++;if(M.min>=90||M.chances>=7)finish();else matchBox()}function startFull(){M.full={px:22,py:50,bx:24,by:50,poss:'user',ai:0};loopFull()}function drawFull(ctx,w,h){let f=M.full;[[18,22,'A'],[18,78,'A'],[42,35,'M'],[42,65,'M'],[70,28,'P'],[70,72,'P'],[78,50,'D'],[58,45,'D']].forEach((p,i)=>{ctx.fillStyle=i<6?'#dfffe8':'#ffd166';ctx.beginPath();ctx.arc(p[0]*w/100,p[1]*h/100,12,0,7);ctx.fill();ctx.fillStyle='#06110b';ctx.font='11px system-ui';ctx.fillText(p[2],p[0]*w/100-4,p[1]*h/100+4)});ctx.fillStyle='#55e58f';ctx.beginPath();ctx.arc(f.px*w/100,f.py*h/100,16,0,7);ctx.fill();ctx.fillStyle='#06110b';ctx.font='bold 12px system-ui';ctx.fillText('EU',f.px*w/100-8,f.py*h/100+4);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.bx*w/100,f.by*h/100,8,0,7);ctx.fill()}function loopFull(){if(!M||M.mode!=='completo')return;if(!M.paused){let f=M.full,sp=.55+S.career.skills.Velocidade/300;if(keys.left||keys.ArrowLeft||keys.a)f.px-=sp;if(keys.right||keys.ArrowRight||keys.d)f.px+=sp;if(keys.up||keys.ArrowUp||keys.w)f.py-=sp;if(keys.down||keys.ArrowDown||keys.s)f.py+=sp;f.px=cl(f.px,5,95);f.py=cl(f.py,8,92);if(f.poss==='user'){f.bx=f.px+2;f.by=f.py}else{f.ai++;f.bx=cl(f.bx+(Math.random()-.45)*1.8,5,95);f.by=cl(f.by+(Math.random()-.5)*2.2,8,92);if(f.ai%90===0){let j=S.calendar.find(x=>x.id===M.id),home=j.h===S.user.club;if(Math.random()<.33){home?M.ga++:M.gh++;M.log.push(`${Math.floor(M.min)}' O adversário marcou.`)}else{M.log.push(`${Math.floor(M.min)}' Você recompôs e roubou a bola.`);f.poss='user'}}}M.min+=.025;if(M.min>=90)finish()}draw();RAF=requestAnimationFrame(loopFull)}function fullAction(a){if(!M||M.mode!=='completo')return;let f=M.full,c=S.career,j=S.calendar.find(x=>x.id===M.id),home=j.h===S.user.club;if(a==='tackle'){f.poss='user';M.log.push(`${Math.floor(M.min)}' Carrinho limpo. Bola nossa.`);matchBox();return}if(f.poss!=='user'){msg('Sem a bola.');return}let chance=.35;if(a==='shoot'){chance=.25+c.skills.Finalização/170+(f.px>70?.18:0)-Math.abs(f.py-50)/170;if(Math.random()<chance){home?M.gh++:M.ga++;M.log.push(`${Math.floor(M.min)}' Chute forte. GOOOL!`)}else M.log.push(`${Math.floor(M.min)}' Chute para fora.`);f.poss='opp'}if(a==='pass'){chance=.5+c.skills.Passe/220;if(Math.random()<chance){M.log.push(`${Math.floor(M.min)}' Passe quebrando linhas.`);f.px=cl(f.px+12,5,92);f.bx=f.px}else{M.log.push(`${Math.floor(M.min)}' Passe interceptado.`);f.poss='opp'}}if(a==='cross'){chance=.34+c.skills.Passe/260+(f.py<25||f.py>75?.22:-.05);if(Math.random()<chance){home?M.gh++:M.ga++;M.log.push(`${Math.floor(M.min)}' Cruzamento na medida. Gol!`)}else M.log.push(`${Math.floor(M.min)}' Cruzamento cortado.`);f.poss='opp'}c.energia=cl(c.energia-2);matchBox()}function finish(){clearInterval(T);cancelAnimationFrame(RAF);let j=S.calendar.find(x=>x.id===M.id),base=score(j.h,j.a),gh=Math.max(M.gh,base[0]),ga=Math.max(M.ga,base[1]);apply(j,gh,ga);round().filter(x=>!x.ok&&x.id!==j.id).forEach(x=>{let s=score(x.h,x.a);apply(x,s[0],s[1])});let home=j.h===S.user.club,gf=home?gh:ga,gc=home?ga:gh,win=gf>gc,drawn=gf===gc,renda=home?Math.round(club().tor*S.finance.ticket*(win?.48:drawn?.38:.28)):0,weekly=Math.round(S.finance.sponsor/6+S.finance.merch/8-wage()/2+renda);S.finance.saldo+=weekly;S.career.jogos++;S.last={text:`${club(j.h).n} ${gh} x ${ga} ${club(j.a).n}`,renda,weekly};S.news.push(`${S.last.text}. Saldo da semana: ${money(weekly)}.`);train(true);S.week++;S.phase='pós-jogo';M=null;box.innerHTML=`<div class="row"><h2>Pós-jogo</h2><button data-close="1">Fechar</button></div><div class="score">${S.last.text}</div><div class="g3"><div class="card">Renda<div class="big">${money(renda)}</div></div><div class="card">Saldo semana<div class="big">${money(weekly)}</div></div><div class="card">Posição<div class="big">${position()}º</div></div></div><br><button class="pri" data-close="1">Continuar</button>`;render()}function train(silent=false){let int=S.training.intensity,rest=S.training.rest;squad().forEach(p=>{let dev=(int-45)/18+(club().ct-1)*.25+R(-1,2);if(p.idade<24&&Math.random()<.28)p.ov=cl(p.ov+Math.max(0,dev),1,p.pot);p.forma=cl(p.forma+(int-45)/20+R(-2,3));p.fis=cl(p.fis-int/26+rest/20)});if(!silent)msg('Treino aplicado')}function auto(){squad().forEach(p=>p.tit=false);squad().filter(p=>!p.les&&!p.susp).sort((a,b)=>b.ov-a.ov).slice(0,11).forEach(p=>p.tit=true);render()}function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
document.addEventListener('click',e=>{let b=e.target.closest('button,.modecard');if(!b)return;let d=b.dataset;if(d.start==='new'){setup();return}if(d.start==='cont'){S=load();render();return}if(d.start==='demo'){S=newGame();render();return}if(d.start==='back'){S=null;render();return}if(d.start==='create'){S=newGame({coach:$('#coach').value,club:$('#clubSelect').value,difficulty:$('#difficulty').value});render();return}if(d.start==='how'){modal.classList.add('open');box.innerHTML=`<div class="row"><h2>Como jogar</h2><button data-close="1">Fechar</button></div><div class="grid"><div class="card"><h3>1. Prepare</h3><p class="mut">Treino, escalação, tática e mercado.</p></div><div class="card"><h3>2. Escolha modo</h3><p class="mut">Momentos, técnico ou completo.</p></div><div class="card"><h3>3. Database</h3><p class="mut">Clubes e atletas v2026 com nomes alterados.</p></div><div class="card"><h3>4. Continue</h3><p class="mut">Save local no navegador.</p></div></div><br><div class="disc">${DISC}</div>`;return}if(d.view){V=d.view;render();return}if(d.tab){TAB=d.tab;render();return}if(d.action==='match'){openMatch();return}if(d.action==='auto'){auto();return}if(d.action==='train'){train();render();return}if(d.action==='scout'){S.market.push(...Array.from({length:6},(_,i)=>player(i,'market',R(56,82))));S.finance.saldo-=120000;render();return}if(d.action==='save'){save();msg('Salvo');return}if(d.action==='export'){$('#saveBox').value=JSON.stringify(S,null,2);return}if(d.action==='import'){try{S=migrate(JSON.parse($('#saveBox').value));save();render()}catch(err){msg('Save inválido')}return}if(d.action==='reset'&&confirm('Resetar jogo?')){localStorage.removeItem(SAVE);S=null;render();return}if(d.mode){S.mode=d.mode;if(!M)render();return}if(d.player){openPlayer(d.player);return}if(d.buy){let p=S.market.find(x=>x.id===d.buy);if(!p||S.finance.saldo<p.valor){msg('Saldo insuficiente');return}S.finance.saldo-=p.valor;p.team=S.user.club;S.players.push(p);S.market=S.market.filter(x=>x.id!==p.id);render();return}if(d.sell){let p=S.players.find(x=>x.id===d.sell);if(!p)return;if(p.star){msg('Não dá para vender o Boleiro');return}S.finance.saldo+=p.valor;S.players=S.players.filter(x=>x.id!==p.id);render();return}if(d.life){let c=S.career;if(d.life==='rest')c.energia=cl(c.energia+18);if(d.life==='boot'){if(c.grana<500){msg('Grana insuficiente');return}c.grana-=500;c.skills.Finalização=cl(c.skills.Finalização+2)}if(d.life==='media')c.fama=cl(c.fama+4);if(d.life==='night'){c.feliz=cl((c.feliz||70)+12);c.energia=cl(c.energia-16)}render();return}if(d.close){clearInterval(T);cancelAnimationFrame(RAF);modal.classList.remove('open');render();return}if(d.mm&&M){clearInterval(T);cancelAnimationFrame(RAF);M.mode=d.mm;M.full=null;matchBox();if(M.mode==='tecnico')startCoach();if(M.mode==='completo')startFull();return}if(d.match==='pause'&&M){M.paused=!M.paused;matchBox();return}if(d.match==='finish'&&M){finish();return}if(d.lance&&M){lance(d.lance);return}if(d.coach&&M){if(d.coach==='sub'){M.boost+=2;M.log.push(`${M.min}' Substituição feita.`)}else{S.tac.men=d.coach;M.log.push(`${M.min}' Técnico mudou para ${d.coach}.`)}matchBox();return}if(d.full){fullAction(d.full);return}});document.addEventListener('change',e=>{let x=e.target;if(!S)return;if(x.dataset.tit){let p=S.players.find(p=>p.id===x.dataset.tit);p.tit=x.checked;if(xi().length>11){p.tit=false;msg('Máximo de 11 titulares')}render();return}if(x.dataset.tac){S.tac[x.dataset.tac]=x.value;render();return}if(x.dataset.train){S.training[x.dataset.train]=x.value;render();return}if(x.dataset.filter==='pos'){S.filters.pos=x.value;render();return}if(x.dataset.fin){S.finance[x.dataset.fin]=Number(x.value)||S.finance[x.dataset.fin];save();return}});document.addEventListener('input',e=>{let x=e.target;if(!S||!x.dataset.slider)return;if(x.dataset.scope==='tac')S.tac[x.dataset.slider]=Number(x.value);else S.training[x.dataset.slider]=Number(x.value);render()});document.addEventListener('pointerdown',e=>{let h=e.target.closest('[data-hold]');if(h){keys[h.dataset.hold]=true;return}let c=e.target.closest('#cv');if(!c||!M)return;let r=c.getBoundingClientRect(),px=cl((e.clientX-r.left)/r.width*100),py=cl((e.clientY-r.top)/r.height*100);if(M.mode==='momentos'){M.ax=px;M.ay=py;draw()}if(M.mode==='completo'&&M.full){M.full.px=px;M.full.py=py;draw()}});document.addEventListener('pointerup',e=>{let h=e.target.closest('[data-hold]');if(h)keys[h.dataset.hold]=false});document.addEventListener('pointercancel',()=>{keys={}});document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='j')fullAction('shoot');if(e.key==='k')fullAction('pass');if(e.key==='l')fullAction('cross');if(e.key==='i')fullAction('tackle')});document.addEventListener('keyup',e=>{keys[e.key]=false});S=load();render();})();</script></body></html>
