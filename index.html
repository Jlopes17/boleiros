<style>

g:7px 10px;font-size:12px}.tag.ok{background:#123924;border-color:#55e58f}.tag.warn{background:#3c3215;border-color:#ffd166}.big{font-size:28px;font-weight:1000;letter-spacing:-.04em}.item{background:#0a1911;border:1px solid #214532;border-radius:15px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.stack{display:grid;gap:10px}.table{overflow:auto;border:1px solid #214532;border-radius:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #214532;text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:#bad4c6;background:#0a1911}input,select,textarea{width:100%;background:#07130d;border:1px solid #2c5a42;border-radius:12px;color:#f5fff7;padding:10px}label{font-size:11px;text-transform:uppercase;color:#bad4c6;letter-spacing:.08em}.bar{height:8px;background:#07130d;border-radius:99px;overflow:hidden;border:1px solid #214532}.bar span{height:100%;display:block;background:linear-gradient(90deg,#55e58f,#dbff6b)}.step{position:relative;padding-left:42px}.step:before{content:attr(data-n);position:absolute;left:10px;top:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#173326;color:#55e58f;font-weight:900}.step.done:before{background:#55e58f;color:#041008}.field{height:380px;background:linear-gradient(90deg,#15642f,#218343,#15642f);border:2px solid #ffffff88;border-radius:22px;position:relative;overflow:hidden}.field:before{content:'';position:absolute;inset:7%;border:2px solid #ffffff88;border-radius:18px}.field:after{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff88}.dot{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e9fff0;color:#062112;border:3px solid #0f3e24;font-size:10px;font-weight:1000;z-index:1}.dot.star{background:linear-gradient(145deg,#dbff6b,#55e58f)}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:50;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.box{width:min(1100px,100%);max-height:94vh;overflow:auto;background:#06110b;border:1px solid #4c7d62;border-radius:24px;padding:16px}canvas{width:100%;height:380px;background:#176b34;border-radius:18px;border:1px solid #8ad5a2;touch-action:none;display:block}.toast{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#f5fff7;color:#06110b;border-radius:999px;padding:11px 15px;font-weight:900;z-index:60}.toast.show{display:block}.bottom{display:none}.score{text-align:center;font-size:42px;font-weight:1000}.timeline{display:flex;gap:4px}.timeline span{height:7px;flex:1;background:#123625;border-radius:99px}.timeline .on{background:#55e58f}.modecard{cursor:pointer}.modecard.on{outline:3px solid #55e58f}.touch{display:grid;grid-template-columns:120px 1fr;gap:12px;margin-top:10px}.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:5px;justify-content:center}.dpad button,.actBtns button{min-height:40px}.actBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.mobileHint{display:none}.stickyCta{position:sticky;bottom:8px;z-index:6;padding:8px;border-radius:18px;background:#06110bd9;border:1px solid #ffffff18;backdrop-filter:blur(10px)}@media(max-width:900px){body{font-size:15px}.shell{display:block}.side{display:none}.main{padding:10px 10px 92px}.grid,.g3,.g4{grid-template-columns:1fr}.hud{justify-content:flex-start}.bottom{display:grid;position:fixed;left:0;right:0;bottom:0;grid-template-columns:repeat(5,1fr);background:#06110bf5;border-top:1px solid #ffffff18;z-index:30;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;border-radius:0;background:transparent;font-size:11px;padding:10px 4px}.field{height:305px}canvas{height:58vh;min-height:330px;max-height:520px}.box{padding:12px;border-radius:18px;max-height:96vh}.touch{grid-template-columns:1fr}.actBtns{grid-template-columns:repeat(2,1fr)}.actBtns button{min-height:52px}.dpad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,48px)}.dpad button{min-height:48px}.mobileHint{display:block}th:nth-child(7),td:nth-child(7),th:nth-child(8),td:nth-child(8){display:none}.hero{padding:12px}.hero .panel{padding:15px}.lead{font-size:16px}.hero h1{font-size:62px}}

<body><div id="app" class="app"></div><div id="modal" class="modal"><div id="box" class="box"></div></div><div id="toast" class="toast"></div>
<script>
'use strict';(()=>{
const SAVE='boleiros_ux_v3',SAVE2='boleiros_ux_v4';let S=null,V='painel',MATCH=null,TIMER=null,RAF=null,keys={};
const app=document.getElementById('app'),modal=document.getElementById('modal'),box=document.getElementById('box'),toast=document.getElementById('toast');
const $=(s,c=document)=>c.querySelector(s),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],cl=(n,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(n))),money=n=>'R$ '+Math.round(n||0).toLocaleString('pt-BR'),safe=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
window.onerror=(m,u,l)=>{app.innerHTML=`<div class="wrap"><div class="panel"><h1>Erro no Boleiros</h1><p>${safe(m)}</p><p>Linha ${l}</p><button class="pri" data-hard-reset="1">Limpar save</button></div></div>`};
const clubNames=['Boleiros FC','Vila Esperança','União da Lapa','Real Capoeira','Atlético Mangue','Portuguesa do Norte','Independente de Minas','Ferroviária Sul','Serra Dourada','Rio Branco Leste'];
const first='Rafael Bruno Caio Diego Felipe Guto Hugo João Kauã Léo Marcos Neto Otávio Paulo Renan Sandro Tiago Vini Wesley Yuri Zeca Danilo Matheus Lucas Davi Enzo'.split(' ');
const last='Silva Souza Lima Costa Santos Rocha Moura Ribeiro Alves Gomes Castro Cardoso Nogueira Batista Duarte Teixeira Melo Araújo'.split(' ');
const pos='GOL ZAG ZAG LE LD VOL MC MEI PE PD ATA ATA ZAG MC MEI ATA VOL PD'.split(' ');
const nav=[['painel','Painel','Hoje'],['agenda','Agenda','Jogos'],['elenco','Elenco','Atletas'],['escala','Escalação','XI'],['taticas','Táticas','Plano'],['treino','Treino','Evoluir'],['partida','Partida','Jogar'],['mercado','Mercado','Contratar'],['financas','Finanças','Clube'],['tabela','Tabela','Liga'],['carreira','Carreira','Boleiro'],['config','Config','Save']];
function st(){return{j:0,v:0,e:0,d:0,gp:0,gc:0,sg:0,pts:0}}
function player(i,team,lvl=62,star=false){let idade=star?18:rnd(17,36),ov=star?72:cl(lvl+rnd(-14,14),35,91),pot=cl(ov+rnd(idade<23?6:0,idade<24?20:8),ov,99);let p={id:'p'+Math.random().toString(36).slice(2),nome:star?'Léo Boleiro':pick(first)+' '+pick(last),pos:star?'ATA':pos[i%pos.length],idade,ov,pot,fis:rnd(64,100),mor:rnd(48,92),forma:rnd(48,88),sal:Math.round(ov*ov*rnd(15,25)),contr:rnd(8,36),les:0,susp:0,tit:i<11,team,star,gols:0,ass:0};p.valor=Math.round(ov*ov*(pot/75)*(idade<23?1.25:idade>31?.72:1)*850);return p}
function schedule(ids){let a=[...ids],out=[];for(let r=0;r<a.length-1;r++){let gs=[];for(let i=0;i<a.length/2;i++)gs.push({h:a[i],a:a[a.length-1-i]});out.push(gs);a=[a[0],a[a.length-1],...a.slice(1,-1)]}return out.concat(out.map(gs=>gs.map(g=>({h:g.a,a:g.h}))))}
function newGame(o={}){let teams=clubNames.map((n,i)=>({id:'t'+i,n,rep:rnd(52,78)+(i===0?5:0),tor:rnd(4500,18000),est:rnd(9000,28000),ct:rnd(1,3),base:rnd(1,3),med:rnd(1,3),moral:rnd(45,85),st:st()})),players=[];teams.forEach(t=>{for(let i=0;i<19;i++)players.push(player(i,t.id,t.rep,t.id==='t0'&&i===10))});let cal=[];schedule(teams.map(t=>t.id)).forEach((gs,r)=>gs.forEach((g,k)=>cal.push({id:`j${r}_${k}`,rod:r+1,h:g.h,a:g.a,ok:false,gh:null,ga:null,comp:'Liga Boleiros'})));return{version:4,week:1,season:1,phase:'preparação',user:{coach:o.coach||'João',club:o.club||'t0',difficulty:o.difficulty||'Normal'},teams,players,calendar:cal,market:Array.from({length:15},(_,i)=>player(i,'market',rnd(54,78))),tac:{form:'4-3-3',men:'Equilibrada',press:'Média',marc:'Zona',passes:'Misto',ritmo:55,risco:45,linha:50},training:{focus:'Equilibrado',intensity:55,rest:35,individual:'Ataque'},finance:{saldo:1800000,ticket:35,sponsor:260000,merch:45000},career:{nome:'Léo Boleiro',energia:82,feliz:72,fama:10,grana:1500,rel:{Técnico:70,Torcida:60,Elenco:65,Mídia:35},skills:{Finalização:66,Passe:58,Drible:63,Velocidade:67,Defesa:35},gols:0,ass:0,jogos:0},mode:'momentos',plan:{training:false,lineup:false,tactic:false,market:false},news:['A diretoria apresentou o projeto Boleiros. Objetivo: brigar na parte de cima da tabela.'],ach:[],last:null,filters:{pos:'Todos'}}}
function migrate(s){if(!s)return null;let n=newGame();s.version=4;s.teams=s.teams||s.times||n.teams;s.players=s.players||s.elenco||n.players;s.calendar=s.calendar||s.cal||n.calendar;s.calendar.forEach(j=>{if(!j.h&&j.c)j.h=j.c;if(!j.a&&j.f)j.a=j.f;if(!j.id)j.id='j'+Math.random().toString(36).slice(2)});s.market=s.market||s.mercado||n.market;s.user=s.user||n.user;s.tac=Object.assign(n.tac,s.tac||{});s.training=Object.assign(n.training,s.training||s.train||{});s.finance=Object.assign(n.finance,s.finance||s.fin||{});s.career=Object.assign(n.career,s.career||{});s.career.rel=Object.assign(n.career.rel,s.career.rel||{});s.career.skills=Object.assign(n.career.skills,s.career.skills||{});s.mode=['momentos','tecnico','completo'].includes(s.mode)?s.mode:(s.modo==='lances'?'momentos':'tecnico');s.plan=Object.assign(n.plan,s.plan||{});s.filters=Object.assign(n.filters,s.filters||{});s.news=s.news||n.news;s.ach=s.ach||[];s.week=s.week||s.sem||1;s.season=s.season||1;s.phase=s.phase||'preparação';s.teams.forEach(t=>{t.st=t.st||st();t.moral=t.moral??60;t.ct=t.ct||1;t.base=t.base||1;t.med=t.med||1;t.tor=t.tor||8000;t.est=t.est||12000;t.n=t.n||t.nome||'Clube'});s.players.forEach((p,i)=>{p.id=p.id||('p'+i);p.fis=p.fis??80;p.mor=p.mor??70;p.forma=p.forma??70;p.les=p.les||0;p.susp=p.susp||0;p.contr=p.contr||12;p.valor=p.valor||p.ov*p.ov*800;p.team=p.team||s.user.club});return s}
function load(){try{return migrate(JSON.parse(localStorage.getItem(SAVE2)||localStorage.getItem(SAVE)||localStorage.getItem('boleiros_v1')||'null'))}catch(e){return null}}function save(){if(S){localStorage.setItem(SAVE,JSON.stringify(S));localStorage.setItem(SAVE2,JSON.stringify(S))}}
function club(id=S.user.club){return S.teams.find(t=>t.id===id)||S.teams[0]}function squad(tid=S.user.club){return S.players.filter(p=>p.team===tid)}function xi(tid=S.user.club){return squad(tid).filter(p=>p.tit&&!p.les&&!p.susp).slice(0,11)}function avg(a,f){return a.length?Math.round(a.reduce((s,x)=>s+f(x),0)/a.length):0}function strength(tid=S.user.club){let ps=tid===S.user.club?xi(tid):squad(tid).sort((a,b)=>b.ov-a.ov).slice(0,11),base=ps.length?avg(ps,p=>p.ov*p.fis/100*p.mor/100*p.forma/75):club(tid).rep,tac=tid===S.user.club?(S.tac.men==='Ofensiva'?2:S.tac.men==='Defensiva'?1:0)+(S.tac.press==='Alta'?1:0):0;return cl(base+club(tid).ct*1.4+club(tid).moral/30+tac,1,99)}function wage(){return squad().reduce((s,p)=>s+p.sal,0)}function next(){return S.calendar.find(j=>!j.ok&&(j.h===S.user.club||j.a===S.user.club))}function round(){let n=next();return n?S.calendar.filter(j=>!j.ok&&j.rod===n.rod):[]}function standings(){return[...S.teams].sort((a,b)=>b.st.pts-a.st.pts||b.st.sg-a.st.sg||b.st.gp-a.st.gp)}function position(){return standings().findIndex(t=>t.id===S.user.club)+1}
function score(h,a){let d=strength(h)+4-strength(a);return[cl(Math.max(0,Math.round((d+rnd(-18,24))/23)+rnd(0,2)),0,7),cl(Math.max(0,Math.round((-d+rnd(-18,24))/23)+rnd(0,2)),0,7)]}
function apply(j,gh,ga){if(j.ok)return;j.ok=true;j.gh=gh;j.ga=ga;let h=club(j.h),a=club(j.a);h.st.j++;a.st.j++;h.st.gp+=gh;h.st.gc+=ga;a.st.gp+=ga;a.st.gc+=gh;h.st.sg=h.st.gp-h.st.gc;a.st.sg=a.st.gp-a.st.gc;if(gh>ga){h.st.v++;a.st.d++;h.st.pts+=3;h.moral=cl(h.moral+3);a.moral=cl(a.moral-2)}else if(ga>gh){a.st.v++;h.st.d++;a.st.pts+=3;a.moral=cl(a.moral+3);h.moral=cl(h.moral-2)}else{h.st.e++;a.st.e++;h.st.pts++;a.st.pts++;h.moral=cl(h.moral+1);a.moral=cl(a.moral+1)}}
function render(){save();app.innerHTML=S?layout():start()}
function start(){let has=!!load();return `<section class="hero"><div class="panel"><div class="logo">B</div><h1>Boleiros</h1><p class="lead">Manager brasileiro com alma de Brasfoot e três jeitos de jogar a partida: momentos decisivos, simulação com controle do técnico e jogo completo em visão superior.</p><div class="actions"><button class="pri" data-start="new">Novo jogo</button>${has?`<button data-start="cont">Continuar campanha</button>`:''}<button data-start="how">Como jogar</button><button data-start="demo">Demo rápida</button></div><div class="g4"><div class="card"><b>Campanha salva</b><p class="mut">O save continua no navegador mesmo após updates.</p></div><div class="card"><b>Manager</b><p class="mut">Elenco, táticas, treino, mercado e finanças.</p></div><div class="card"><b>3 modos</b><p class="mut">Momentos, técnico ou partida jogável.</p></div><div class="card"><b>Mobile first</b><p class="mut">Navegação inferior e controles touch.</p></div></div></div></section>`}
function setup(){app.innerHTML=`<section class="hero"><div class="panel"><h1 style="font-size:52px">Criar carreira</h1><p class="lead">Escolha seu clube. Depois é só continuar a campanha pelo botão inicial.</p><div class="grid"><div><label>Nome do técnico</label><input id="coach" value="João"></div><div><label>Clube</label><select id="clubSelect">${clubNames.map((c,i)=>`<option value="t${i}">${c}</option>`).join('')}</select></div><div><label>Dificuldade</label><select id="difficulty"><option>Normal</option><option>Fácil</option><option>Difícil</option></select></div><div><label>Estilo inicial</label><select><option>Equilibrado</option><option>Ofensivo</option><option>Retranca</option></select></div></div><br><button class="pri" data-start="create">Começar temporada</button> <button data-start="back">Voltar</button></div></section>`}
function layout(){return `<div class="shell"><aside class="side"><div class="brand"><div class="logo">B</div><div><h2>Boleiros</h2><p class="mut">${safe(club().n)} • T${S.season}</p></div></div><nav class="nav">${nav.map(([id,l,s])=>`<button data-view="${id}" class="${V===id?'on':''}"><span>${l}</span><small>${s}</small></button>`).join('')}</nav></aside><main class="main"><div class="row"><div><h1>${title()}</h1><p class="mut">${sub()}</p></div><div class="hud"><span class="pill">Semana ${S.week}</span><span class="pill">${money(S.finance.saldo)}</span><span class="pill">Força ${strength()}</span><span class="pill">${position()}º</span></div></div>${pages[V]()}<nav class="bottom">${[['painel','Painel'],['elenco','Elenco'],['partida','Jogo'],['mercado','Mercado'],['tabela','Tabela']].map(([id,l])=>`<button data-view="${id}" class="${V===id?'on':''}">${l}</button>`).join('')}</nav></main></div>`}
function title(){return{painel:'Painel da semana',agenda:'Agenda',elenco:'Elenco',escala:'Escalação',taticas:'Táticas',treino:'Treino',partida:'Central da partida',mercado:'Mercado',financas:'Finanças',tabela:'Tabela',carreira:'Carreira do boleiro',config:'Configurações'}[V]||'Boleiros'}function sub(){return{painel:'Prepare o time antes da bola rolar.',agenda:'Próximos jogos e rodada atual.',elenco:'Jogadores, contratos, lesões e moral.',escala:'Veja o onze titular no campo.',taticas:'Plano de jogo e impacto na força.',treino:'Evolua sem destruir o físico.',partida:'Escolha como jogar a partida.',mercado:'Compre, venda e renove.',financas:'Caixa, ingresso e estrutura.',tabela:'Classificação da Liga Boleiros.',carreira:'Vida e evolução do craque.',config:'Save, exportação e reset.'}[V]||''}
function checklist(){let s=[['training','Treino definido','Ajuste intensidade e descanso'],['lineup','Escalação revisada','Confirme 11 titulares'],['tactic','Tática preparada','Mentalidade e pressão'],['market','Mercado avaliado','Opcional, busque reforços']];return `<div class="stack">${s.map((x,i)=>`<div class="card step ${S.plan[x[0]]?'done':''}" data-n="${i+1}"><b>${x[1]}</b><p class="mut">${x[2]}</p></div>`).join('')}</div>`}
function nextCard(){let j=next();if(!j)return `<div class="item"><b>Temporada encerrada</b><span class="mut">Em breve: novas temporadas e acesso.</span></div>`;let opp=j.h===S.user.club?j.a:j.h;return `<div class="card"><div class="row"><div><span class="tag warn">Próxima partida</span><h2>${club(j.h).n} x ${club(j.a).n}</h2><p class="mut">Rodada ${j.rod} • ${j.h===S.user.club?'Casa':'Fora'} • adversário força ${strength(opp)}</p></div><button class="pri" data-action="match">Jogar</button></div><div class="g3"><div><span class="mut">Nossa força</span><div class="big">${strength()}</div></div><div><span class="mut">Oponente</span><div class="big">${strength(opp)}</div></div><div><span class="mut">Modo</span><div class="big">${modeName(S.mode)}</div></div></div></div>`}
function modeName(m){return m==='momentos'?'Momentos':m==='tecnico'?'Técnico':'Completo'}
function table(l=99){return `<div class="table"><table><tr><th>#</th><th>Clube</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${standings().slice(0,l).map((t,i)=>`<tr><td>${i+1}</td><td><b>${t.n}</b>${t.id===S.user.club?` <span class="tag ok">Você</span>`:''}</td><td><b>${t.st.pts}</b></td><td>${t.st.j}</td><td>${t.st.v}</td><td>${t.st.e}</td><td>${t.st.d}</td><td>${t.st.sg}</td></tr>`).join('')}</table></div>`}
function fixture(j){return `<div class="item"><div><b>${club(j.h).n}</b> ${j.ok?j.gh:'-'} x ${j.ok?j.ga:'-'} <b>${club(j.a).n}</b><br><span class="mut">${j.comp} • Rodada ${j.rod}</span></div>${!j.ok&&(j.h===S.user.club||j.a===S.user.club)?`<button class="pri" data-action="match">Jogar</button>`:''}</div>`}
function rows(ps,own=true){return `<div class="table"><table><tr><th></th><th>Jogador</th><th>Pos</th><th>OV</th><th>Pot</th><th>Fís</th><th>Moral</th><th>Valor</th><th>Ação</th></tr>${ps.map(p=>`<tr><td>${own?`<input type="checkbox" data-tit="${p.id}" ${p.tit?'checked':''} ${p.les||p.susp?'disabled':''}>`:''}</td><td><b>${safe(p.nome)}</b>${p.star?' ⭐':''}<br><span class="mut">${p.idade} anos ${p.les?`• lesão ${p.les}s`:''}</span></td><td>${p.pos}</td><td><b>${p.ov}</b></td><td>${p.pot}</td><td>${p.fis}</td><td>${p.mor}</td><td>${money(p.valor)}</td><td>${own?`<button data-player="${p.id}">Detalhes</button>`:`<button class="pri" data-buy="${p.id}">Comprar</button>`}</td></tr>`).join('')}</table></div>`}
const xy=[[8,50],[24,22],[24,43],[24,58],[24,78],[44,32],[44,52],[44,72],[70,25],[83,50],[70,75]];function pitch(){return `<div class="field">${xi().map((p,i)=>`<div class="dot ${p.star?'star':''}" style="left:${xy[i]?.[0]||50}%;top:${xy[i]?.[1]||50}%">${p.pos}</div>`).join('')}</div>`}
function slider(k,l,v,s){return `<div><label>${l}</label><input type="range" min="0" max="100" value="${v}" data-slider="${k}" data-scope="${s}"><div class="row"><span class="mut">baixo</span><b>${v}</b><span class="mut">alto</span></div></div>`}
function recs(){let r=[];if(xi().length<11)r.push('Você tem menos de 11 titulares disponíveis.');if(avg(xi(),p=>p.fis)<72)r.push('O time está cansado, aumente descanso.');if(S.finance.saldo<0)r.push('Caixa negativo, venda ou reduza folha.');if(!S.plan.tactic)r.push('Revise a tática antes do jogo.');if(!r.length)r.push('Tudo pronto. Pode jogar.');return r.map(x=>`<div class="item">${x}</div>`).join('')}
const pages={painel(){return `<div class="grid"><section class="panel"><div class="row"><h2>Resumo</h2><button class="pri" data-action="match">Jogar próxima</button></div><div class="g4"><div class="card">Posição<div class="big">${position()}º</div></div><div class="card">Força<div class="big">${strength()}</div></div><div class="card">Folha<div class="big">${money(wage())}</div></div><div class="card">Fase<div class="big">${S.phase}</div></div></div><br>${nextCard()}</section><section class="panel"><h2>Checklist</h2>${checklist()}<h3>Assistente</h3>${recs()}</section></div><br><div class="grid"><section class="panel"><h2>Notícias</h2><div class="stack">${S.news.slice(-7).reverse().map(n=>`<div class="item">${safe(n)}</div>`).join('')}</div></section><section class="panel"><h2>Top 6</h2>${table(6)}</section></div>`},agenda(){return `<div class="grid"><section class="panel"><h2>Próximos jogos</h2><div class="stack">${S.calendar.filter(j=>!j.ok&&(j.h===S.user.club||j.a===S.user.club)).slice(0,8).map(fixture).join('')}</div></section><section class="panel"><h2>Rodada atual</h2><div class="stack">${round().map(fixture).join('')||'<p class=mut>Rodada concluída.</p>'}</div></section></div>`},elenco(){let ps=squad().filter(p=>S.filters.pos==='Todos'||p.pos===S.filters.pos).sort((a,b)=>Number(b.tit)-Number(a.tit)||b.ov-a.ov);return `<section class="panel"><div class="row"><h2>Elenco</h2><div><select style="width:auto" data-filter="pos"><option>Todos</option>${['GOL','ZAG','LE','LD','VOL','MC','MEI','PE','PD','ATA'].map(x=>`<option ${S.filters.pos===x?'selected':''}>${x}</option>`).join('')}</select> <button data-action="auto">Escalar melhores</button></div></div>${rows(ps,true)}</section>`},escala(){return `<div class="grid"><section class="panel"><h2>Campo</h2>${pitch()}<p class="mut">Selecione titulares no elenco.</p></section><section class="panel"><h2>Onze inicial</h2>${rows(xi(),true)}</section></div>`},taticas(){return `<section class="panel"><h2>Plano de jogo</h2><div class="g3"><div><label>Formação</label><select data-tac="form">${['4-3-3','4-4-2','4-2-3-1','3-5-2','5-3-2'].map(x=>`<option ${S.tac.form===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Mentalidade</label><select data-tac="men">${['Defensiva','Equilibrada','Ofensiva'].map(x=>`<option ${S.tac.men===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Pressão</label><select data-tac="press">${['Baixa','Média','Alta'].map(x=>`<option ${S.tac.press===x?'selected':''}>${x}</option>`).join('')}</select></div>${slider('ritmo','Ritmo',S.tac.ritmo,'tac')}${slider('risco','Risco',S.tac.risco,'tac')}${slider('linha','Linha defensiva',S.tac.linha,'tac')}</div><br><div class="card">Força atual: <b>${strength()}</b>. Ofensiva gera mais chances, mas abre espaço.</div></section>`},treino(){return `<section class="panel"><h2>Treino da semana</h2><div class="g3"><div><label>Foco coletivo</label><select data-train="focus">${['Equilibrado','Finalização','Defesa','Físico','Posse de bola'].map(x=>`<option ${S.training.focus===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Foco do boleiro</label><select data-train="individual">${['Ataque','Passe','Drible','Velocidade','Defesa'].map(x=>`<option ${S.training.individual===x?'selected':''}>${x}</option>`).join('')}</select></div>${slider('intensity','Intensidade',S.training.intensity,'train')}${slider('rest','Descanso',S.training.rest,'train')}</div><br><button class="pri" data-action="train">Aplicar treino</button></section>`},partida(){return `<section class="panel"><h2>Central da partida</h2>${nextCard()}<br><div class="g3"><div class="card modecard ${S.mode==='momentos'?'on':''}" data-mode="momentos"><h3>Momentos decisivos</h3><p class="mut">O jogo cria lances importantes. Você decide ação e mira.</p><button class="${S.mode==='momentos'?'pri':''}" data-mode="momentos">Selecionar</button></div><div class="card modecard ${S.mode==='tecnico'?'on':''}" data-mode="tecnico"><h3>Simulação do técnico</h3><p class="mut">A partida roda sozinha. Você muda tática, pausa e substitui.</p><button class="${S.mode==='tecnico'?'pri':''}" data-mode="tecnico">Selecionar</button></div><div class="card modecard ${S.mode==='completo'?'on':''}" data-mode="completo"><h3>Jogar completo</h3><p class="mut">Visão superior com mover, passe, chute, cruzamento e carrinho.</p><button class="${S.mode==='completo'?'pri':''}" data-mode="completo">Selecionar</button></div></div><br><div class="stickyCta"><button class="pri" data-action="match">Começar partida</button></div></section>`},mercado(){return `<div class="grid"><section class="panel"><div class="row"><h2>Comprar</h2><button data-action="scout">Buscar jogadores</button></div>${rows(S.market.sort((a,b)=>b.ov-a.ov),false)}</section><section class="panel"><h2>Vender e renovar</h2><div class="stack">${squad().sort((a,b)=>b.valor-a.valor).map(p=>`<div class="item"><div><b>${p.nome}</b>${p.star?' ⭐':''}<br><span class="mut">${p.pos} ${p.ov} • contrato ${p.contr} meses • ${money(p.valor)}</span></div><div><button data-renew="${p.id}">Renovar</button> <button class="bad" data-sell="${p.id}">Vender</button></div></div>`).join('')}</div></section></div>`},financas(){let weekly=Math.round(S.finance.sponsor/6+S.finance.merch/8-wage()/2);return `<section class="panel"><h2>Finanças</h2><div class="g4"><div class="card">Saldo<div class="big">${money(S.finance.saldo)}</div></div><div class="card">Folha semanal<div class="big">${money(wage()/2)}</div></div><div class="card">Base semanal<div class="big">${money(weekly)}</div></div><div class="card"><label>Ingresso</label><input type="number" data-fin="ticket" value="${S.finance.ticket}"></div></div><br><div class="grid"><button data-up="ct">Melhorar CT</button><button data-up="base">Melhorar base</button><button data-up="med">Melhorar médico</button><button data-up="est">Expandir estádio</button></div></section>`},tabela(){return `<section class="panel"><h2>Liga Boleiros</h2>${table()}</section>`},carreira(){let c=S.career;return `<section class="panel"><h2>${c.nome}</h2><div class="g4"><div class="card">Energia<div class="big">${c.energia}</div></div><div class="card">Felicidade<div class="big">${c.feliz}</div></div><div class="card">Fama<div class="big">${c.fama}</div></div><div class="card">Grana<div class="big">${money(c.grana)}</div></div></div><br><div class="grid"><div class="card"><h3>Habilidades</h3>${Object.entries(c.skills).map(([k,v])=>`<div class="item"><span>${k}</span><div style="width:160px"><div class="bar"><span style="width:${v}%"></span></div></div></div>`).join('')}</div><div class="card"><h3>Vida fora de campo</h3><button data-life="rest">Descansar</button> <button data-life="boot">Comprar chuteira</button> <button data-life="media">Dar entrevista</button> <button data-life="night">Sair à noite</button><br><br>${Object.entries(c.rel).map(([k,v])=>`<div class="item"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div></section>`},config(){return `<section class="panel"><h2>Configurações</h2><button class="pri" data-action="save">Salvar</button> <button data-action="export">Exportar</button> <button data-action="import">Importar</button> <button class="bad" data-action="reset">Resetar</button><br><br><textarea id="saveBox" rows="10" placeholder="Exportar ou colar save aqui"></textarea><br><br><h3>Conquistas</h3>${S.ach.map(a=>`<div class="item"><b>${a}</b></div>`).join('')||'<p class=mut>Nenhuma ainda.</p>'}</section>`}};
function openPlayer(id){let p=S.players.find(x=>x.id===id);modal.classList.add('open');box.innerHTML=`<div class="row"><div><h2>${p.nome} ${p.star?'⭐':''}</h2><p class="mut">${p.pos} • ${p.idade} anos • contrato ${p.contr} meses</p></div><button data-close="1">Fechar</button></div><div class="g4"><div class="card">OV<div class="big">${p.ov}</div></div><div class="card">Potencial<div class="big">${p.pot}</div></div><div class="card">Físico<div class="big">${p.fis}</div></div><div class="card">Moral<div class="big">${p.mor}</div></div></div><br><div class="grid"><div class="card"><h3>Contrato</h3><p>Salário: <b>${money(p.sal)}</b></p><p>Valor: <b>${money(p.valor)}</b></p><button data-renew="${p.id}">Renovar</button></div><div class="card"><h3>Status</h3><p>${p.les?'Lesionado por '+p.les+' semanas':'Disponível'}</p></div></div>`}
function openMatch(){let j=next();if(!j){msg('Sem partida pendente');return}clearInterval(TIMER);cancelAnimationFrame(RAF);MATCH={id:j.id,min:0,gh:0,ga:0,x:50,y:50,ax:85,ay:50,log:['A bola vai rolar.'],mode:S.mode,chances:0,paused:false,boost:0,full:null};modal.classList.add('open');matchBox();if(MATCH.mode==='tecnico')startCoach();if(MATCH.mode==='completo')startFull()}
function matchBox(){let j=S.calendar.find(x=>x.id===MATCH.id);box.innerHTML=`<div class="row"><h2>${club(j.h).n} ${MATCH.gh} x ${MATCH.ga} ${club(j.a).n}</h2><button data-close="1">Fechar</button></div><div class="timeline">${Array.from({length:10},(_,i)=>`<span class="${MATCH.min>=i*9?'on':''}"></span>`).join('')}</div><p class="mut">${Math.floor(MATCH.min)}' • ${modeName(MATCH.mode)}</p><canvas id="cv" width="980" height="430"></canvas><div class="mobileHint mut">No modo completo, use o direcional e os botões abaixo. No desktop, use WASD ou setas, J chute, K passe, L cruzar, I carrinho.</div><br>${matchControls()}<section class="panel"><h3>Narração</h3><div class="stack">${MATCH.log.slice(-7).reverse().map(l=>`<div class="item">${safe(l)}</div>`).join('')}</div></section>`;draw()}
function matchControls(){let top=`<button data-mm="momentos" class="${MATCH.mode==='momentos'?'pri':''}">Momentos</button> <button data-mm="tecnico" class="${MATCH.mode==='tecnico'?'pri':''}">Técnico</button> <button data-mm="completo" class="${MATCH.mode==='completo'?'pri':''}">Completo</button> <button data-match="pause">${MATCH.paused?'Continuar':'Pausar'}</button> <button class="pri" data-match="finish">Encerrar</button>`;if(MATCH.mode==='momentos')return top+`<div class="card"><h3>Lance do Boleiro</h3><p class="mut">Toque no campo para mirar.</p><button class="pri" data-lance="chutar">Chutar</button> <button data-lance="passar">Passe</button> <button data-lance="driblar">Drible</button> <button data-lance="defender">Defender</button></div>`;if(MATCH.mode==='tecnico')return top+`<div class="card"><h3>Área técnica</h3><button data-coach="Ofensiva">Ofensiva</button> <button data-coach="Equilibrada">Equilibrada</button> <button data-coach="Defensiva">Defensiva</button> <button data-coach="sub">Substituir cansado</button></div>`;return top+`<div class="touch"><div class="dpad"><span></span><button data-hold="up">▲</button><span></span><button data-hold="left">◀</button><button data-hold="down">▼</button><button data-hold="right">▶</button><span></span><button data-hold="down">▼</button><span></span></div><div class="actBtns"><button class="pri" data-full="shoot">Chutar</button><button data-full="pass">Passe</button><button data-full="cross">Cruzamento</button><button data-full="tackle">Carrinho</button></div></div>`}
function draw(){let c=$('#cv');if(!c||!MATCH)return;let x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle='#176b34';x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=3;x.strokeRect(35,35,w-70,h-70);x.beginPath();x.moveTo(w/2,35);x.lineTo(w/2,h-35);x.stroke();x.beginPath();x.arc(w/2,h/2,58,0,7);x.stroke();if(MATCH.mode==='completo'&&MATCH.full){drawFull(x,w,h);return}[[13,50],[26,25],[26,50],[26,75],[48,30],[48,70],[67,26],[81,50],[67,74]].forEach((p,i)=>{x.fillStyle=i<6?'#dfffe8':'#ffd166';x.beginPath();x.arc(p[0]*w/100,p[1]*h/100,13,0,7);x.fill()});x.fillStyle='#fff';x.beginPath();x.arc(MATCH.x*w/100,MATCH.y*h/100,8,0,7);x.fill();if(MATCH.mode==='momentos'){x.strokeStyle='#ffef9b';x.lineWidth=4;x.beginPath();x.moveTo(MATCH.x*w/100,MATCH.y*h/100);x.lineTo(MATCH.ax*w/100,MATCH.ay*h/100);x.stroke();x.beginPath();x.arc(MATCH.ax*w/100,MATCH.ay*h/100,10,0,7);x.fill()}}
function startCoach(){clearInterval(TIMER);TIMER=setInterval(()=>{if(!MATCH||MATCH.mode!=='tecnico'||MATCH.paused)return;MATCH.min+=rnd(3,6);MATCH.x=cl(MATCH.x+rnd(-18,18),5,95);MATCH.y=cl(MATCH.y+rnd(-22,22),8,92);let j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club,adv=home?j.a:j.h,chance=.22+(strength(S.user.club)+MATCH.boost-strength(adv))/260;if(S.tac.men==='Ofensiva')chance+=.04;if(S.tac.men==='Defensiva')chance-=.02;if(Math.random()<.38){if(Math.random()<chance){home?MATCH.gh++:MATCH.ga++;MATCH.log.push(`${MATCH.min}' GOOOL do ${club().n}!`)}else if(Math.random()<.36){home?MATCH.ga++:MATCH.gh++;MATCH.log.push(`${MATCH.min}' Gol do adversário.`)}else MATCH.log.push(`${MATCH.min}' Ajuste tático segurou uma chance perigosa.`)}if(MATCH.min>=90)finish();else matchBox()},750)}
function lance(a){let c=S.career,j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club,base=.4+c.skills.Finalização/240+c.energia/650-Math.abs(MATCH.ay-50)/180;if(a==='passar')base=.42+c.skills.Passe/230;if(a==='driblar')base=.35+c.skills.Drible/230;if(a==='defender')base=.42+c.skills.Defesa/220;let ok=Math.random()<base;MATCH.min=cl(MATCH.min+rnd(8,17),1,90);if(ok){if(a==='defender'){MATCH.log.push(`${MATCH.min}' Defesa decisiva do Boleiro.`);c.rel.Torcida=cl(c.rel.Torcida+2)}else{home?MATCH.gh++:MATCH.ga++;c.gols++;c.fama=cl(c.fama+3);c.rel.Torcida=cl(c.rel.Torcida+4);MATCH.log.push(`${MATCH.min}' Lance perfeito. Gol do Boleiro!`)}}else{if(a==='defender'){home?MATCH.ga++:MATCH.gh++;MATCH.log.push(`${MATCH.min}' Não conseguiu cortar. Gol deles.`)}else MATCH.log.push(`${MATCH.min}' Tentou ${a}, mas errou.`)}c.energia=cl(c.energia-rnd(3,8));MATCH.chances++;if(MATCH.min>=90||MATCH.chances>=7)finish();else matchBox()}
function startFull(){MATCH.full={px:22,py:50,bx:24,by:50,poss:'user',cool:0,ai:0};loopFull()}
function drawFull(ctx,w,h){let f=MATCH.full;let pts=[[18,22,'A'],[18,78,'A'],[42,35,'M'],[42,65,'M'],[70,28,'P'],[70,72,'P'],[78,50,'D'],[58,45,'D']];pts.forEach((p,i)=>{ctx.fillStyle=i<6?'#dfffe8':'#ffd166';ctx.beginPath();ctx.arc(p[0]*w/100,p[1]*h/100,12,0,7);ctx.fill();ctx.fillStyle='#06110b';ctx.font='11px system-ui';ctx.fillText(p[2],p[0]*w/100-4,p[1]*h/100+4)});ctx.fillStyle='#55e58f';ctx.beginPath();ctx.arc(f.px*w/100,f.py*h/100,16,0,7);ctx.fill();ctx.fillStyle='#06110b';ctx.font='bold 12px system-ui';ctx.fillText('EU',f.px*w/100-8,f.py*h/100+4);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.bx*w/100,f.by*h/100,8,0,7);ctx.fill()}
function loopFull(){if(!MATCH||MATCH.mode!=='completo')return;if(!MATCH.paused){let f=MATCH.full,sp=0.55+S.career.skills.Velocidade/300;if(keys.left||keys.ArrowLeft||keys.a)f.px-=sp;if(keys.right||keys.ArrowRight||keys.d)f.px+=sp;if(keys.up||keys.ArrowUp||keys.w)f.py-=sp;if(keys.down||keys.ArrowDown||keys.s)f.py+=sp;f.px=cl(f.px,5,95);f.py=cl(f.py,8,92);if(f.poss==='user'){f.bx=f.px+2;f.by=f.py}else{f.ai++;f.bx=cl(f.bx+(Math.random()-.45)*1.8,5,95);f.by=cl(f.by+(Math.random()-.5)*2.2,8,92);if(f.ai%90===0){let j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club;if(Math.random()<.33){home?MATCH.ga++:MATCH.gh++;MATCH.log.push(`${Math.floor(MATCH.min)}' O adversário aproveitou espaço e marcou.`)}else MATCH.log.push(`${Math.floor(MATCH.min)}' Você recompôs e roubou a bola.`);f.poss='user';f.bx=f.px;f.by=f.py}}if(MATCH.min<90)MATCH.min+=0.025; if(MATCH.min>=90)finish()}draw();RAF=requestAnimationFrame(loopFull)}
function fullAction(a){if(!MATCH||MATCH.mode!=='completo')return;let f=MATCH.full,c=S.career,j=S.calendar.find(x=>x.id===MATCH.id),home=j.h===S.user.club;if(a==='tackle'){if(Math.hypot(f.px-f.bx,f.py-f.by)<18||f.poss!=='user'){f.poss='user';MATCH.log.push(`${Math.floor(MATCH.min)}' Carrinho limpo. Bola nossa.`)}else MATCH.log.push(`${Math.floor(MATCH.min)}' Carrinho atrasado. Falta perigosa.`);matchBox();return}if(f.poss!=='user'){MATCH.log.push('Sem a bola. Tente roubar primeiro.');matchBox();return}let chance=.35;if(a==='shoot'){chance=.25+c.skills.Finalização/170+(f.px>70?.18:0)-Math.abs(f.py-50)/170;if(Math.random()<chance){home?MATCH.gh++:MATCH.ga++;c.gols++;MATCH.log.push(`${Math.floor(MATCH.min)}' Chute forte. GOOOL!`)}else MATCH.log.push(`${Math.floor(MATCH.min)}' Chute para fora.`);f.poss='opp'}if(a==='pass'){chance=.5+c.skills.Passe/220;if(Math.random()<chance){MATCH.log.push(`${Math.floor(MATCH.min)}' Passe quebrando linhas.`);f.px=cl(f.px+12,5,92);f.bx=f.px}else{MATCH.log.push(`${Math.floor(MATCH.min)}' Passe interceptado.`);f.poss='opp'}}if(a==='cross'){chance=.34+c.skills.Passe/260+(f.py<25||f.py>75?.22:-.05);if(Math.random()<chance){home?MATCH.gh++:MATCH.ga++;MATCH.log.push(`${Math.floor(MATCH.min)}' Cruzamento na medida. Gol!`)}else MATCH.log.push(`${Math.floor(MATCH.min)}' Cruzamento cortado.`);f.poss='opp'}c.energia=cl(c.energia-2);matchBox()}
function finish(){clearInterval(TIMER);cancelAnimationFrame(RAF);let j=S.calendar.find(x=>x.id===MATCH.id),base=score(j.h,j.a),gh=Math.max(MATCH.gh,base[0]),ga=Math.max(MATCH.ga,base[1]);apply(j,gh,ga);round().filter(x=>!x.ok&&x.id!==j.id).forEach(x=>{let s=score(x.h,x.a);apply(x,s[0],s[1])});let home=j.h===S.user.club,gf=home?gh:ga,gc=home?ga:gh,win=gf>gc,drawn=gf===gc,renda=home?Math.round(club().tor*S.finance.ticket*(win?.48:drawn?.38:.28)):0,weekly=Math.round(S.finance.sponsor/6+S.finance.merch/8-wage()/2+renda);S.finance.saldo+=weekly;S.career.jogos++;S.career.energia=cl(S.career.energia-rnd(5,10));S.career.feliz=cl(S.career.feliz+(win?5:drawn?1:-4));S.last={text:`${club(j.h).n} ${gh} x ${ga} ${club(j.a).n}`,renda,weekly};S.news.push(`${S.last.text}. Saldo da semana: ${money(weekly)}.`);train(true);S.week++;S.phase='pós-jogo';S.plan={training:false,lineup:false,tactic:false,market:false};MATCH=null;box.innerHTML=`<div class="row"><h2>Pós-jogo</h2><button data-close="1">Fechar</button></div><div class="score">${S.last.text}</div><div class="g3"><div class="card">Renda<div class="big">${money(renda)}</div></div><div class="card">Saldo semana<div class="big">${money(weekly)}</div></div><div class="card">Posição<div class="big">${position()}º</div></div></div><br><button class="pri" data-close="1">Continuar</button>`;render()}
function train(silent=false){let int=S.training.intensity,rest=S.training.rest;squad().forEach(p=>{let dev=(int-45)/18+(club().ct-1)*.25+rnd(-1,2);if(p.idade<24&&Math.random()<.28)p.ov=cl(p.ov+Math.max(0,dev),1,p.pot);p.forma=cl(p.forma+(int-45)/20+rnd(-2,3));p.fis=cl(p.fis-int/26+rest/20);if(p.les)p.les--;if(Math.random()<Math.max(0,(int-76)/520)/(club().med*.7))p.les=rnd(1,4)});let sk=S.career.skills,f=S.training.individual;if(f==='Ataque')sk.Finalização=cl(sk.Finalização+1);if(f==='Passe')sk.Passe=cl(sk.Passe+1);if(f==='Drible')sk.Drible=cl(sk.Drible+1);if(f==='Velocidade')sk.Velocidade=cl(sk.Velocidade+1);if(f==='Defesa')sk.Defesa=cl(sk.Defesa+1);S.career.energia=cl(S.career.energia+(rest-35)/4-(int-50)/8);S.plan.training=true;if(!silent)msg('Treino aplicado')}
function auto(){squad().forEach(p=>p.tit=false);squad().filter(p=>!p.les&&!p.susp).sort((a,b)=>b.ov-a.ov).slice(0,11).forEach(p=>p.tit=true);S.plan.lineup=true;render()}function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
document.addEventListener('click',e=>{let b=e.target.closest('button,.modecard');if(!b)return;let d=b.dataset;if(d.hardReset){localStorage.removeItem(SAVE);localStorage.removeItem(SAVE2);location.reload()}if(d.start==='new'){setup();return}if(d.start==='cont'){S=load();render();return}if(d.start==='demo'){S=newGame();render();return}if(d.start==='back'){S=null;render();return}if(d.start==='create'){S=newGame({coach:$('#coach').value,club:$('#clubSelect').value,difficulty:$('#difficulty').value});render();return}if(d.start==='how'){modal.classList.add('open');box.innerHTML=`<div class="row"><h2>Como jogar</h2><button data-close="1">Fechar</button></div><div class="grid"><div class="card"><h3>1. Prepare</h3><p class="mut">Treino, escalação, tática e mercado.</p></div><div class="card"><h3>2. Escolha modo</h3><p class="mut">Momentos, técnico ou jogo completo.</p></div><div class="card"><h3>3. Jogue</h3><p class="mut">No completo, use touch ou teclado.</p></div><div class="card"><h3>4. Continue</h3><p class="mut">Seu save fica no navegador.</p></div></div>`;return}if(d.view){V=d.view;render();return}if(d.action==='match'){openMatch();return}if(d.action==='auto'){auto();return}if(d.action==='train'){train();render();return}if(d.action==='scout'){let cost=120000;if(S.finance.saldo<cost){msg('Saldo insuficiente');return}S.finance.saldo-=cost;S.market.push(...Array.from({length:6},(_,i)=>player(i,'market',rnd(56,82))));S.plan.market=true;render();return}if(d.action==='save'){save();msg('Salvo');return}if(d.action==='export'){$('#saveBox').value=JSON.stringify(S,null,2);return}if(d.action==='import'){try{S=migrate(JSON.parse($('#saveBox').value));save();render()}catch(err){msg('Save inválido')}return}if(d.action==='reset'&&confirm('Resetar jogo?')){localStorage.removeItem(SAVE);localStorage.removeItem(SAVE2);S=null;render();return}if(d.mode){S.mode=d.mode;if(!MATCH)render();return}if(d.player){openPlayer(d.player);return}if(d.buy){let p=S.market.find(x=>x.id===d.buy);if(!p)return;if(S.finance.saldo<p.valor){msg('Saldo insuficiente');return}S.finance.saldo-=p.valor;p.team=S.user.club;S.players.push(p);S.market=S.market.filter(x=>x.id!==p.id);S.plan.market=true;render();return}if(d.sell){let p=S.players.find(x=>x.id===d.sell);if(!p)return;if(p.star){msg('Não dá para vender o Boleiro');return}S.finance.saldo+=p.valor;S.players=S.players.filter(x=>x.id!==p.id);render();return}if(d.renew){let p=S.players.find(x=>x.id===d.renew);if(p){p.contr+=18;p.sal=Math.round(p.sal*1.12);msg('Contrato renovado');render()}return}if(d.life){let c=S.career;if(d.life==='rest')c.energia=cl(c.energia+18);if(d.life==='boot'){if(c.grana<500){msg('Grana insuficiente');return}c.grana-=500;c.skills.Finalização=cl(c.skills.Finalização+2)}if(d.life==='media'){c.fama=cl(c.fama+4);c.rel.Mídia=cl(c.rel.Mídia+8)}if(d.life==='night'){c.feliz=cl(c.feliz+12);c.energia=cl(c.energia-16);c.rel.Técnico=cl(c.rel.Técnico-5)}render();return}if(d.up){let c=club(),key=d.up,cost=key==='est'?350000:(c[key]+1)*300000;if(S.finance.saldo<cost){msg('Saldo insuficiente');return}S.finance.saldo-=cost;if(key==='est')c.est+=5000;else c[key]++;render();return}if(d.close){clearInterval(TIMER);cancelAnimationFrame(RAF);modal.classList.remove('open');render();return}if(d.mm&&MATCH){clearInterval(TIMER);cancelAnimationFrame(RAF);MATCH.mode=d.mm;MATCH.full=null;matchBox();if(MATCH.mode==='tecnico')startCoach();if(MATCH.mode==='completo')startFull();return}if(d.match==='pause'&&MATCH){MATCH.paused=!MATCH.paused;msg(MATCH.paused?'Pausado':'Rodando');matchBox();return}if(d.match==='finish'&&MATCH){finish();return}if(d.lance&&MATCH){lance(d.lance);return}if(d.coach&&MATCH){if(d.coach==='sub'){MATCH.boost+=2;MATCH.log.push(`${MATCH.min}' Substituição feita. Time ganhou fôlego.`)}else{S.tac.men=d.coach;MATCH.log.push(`${MATCH.min}' Técnico mudou para ${d.coach}.`)}matchBox();return}if(d.full){fullAction(d.full);return}});
document.addEventListener('change',e=>{let x=e.target;if(!S)return;if(x.dataset.tit){let p=S.players.find(p=>p.id===x.dataset.tit);p.tit=x.checked;if(xi().length>11){p.tit=false;msg('Máximo de 11 titulares')}S.plan.lineup=true;render();return}if(x.dataset.tac){S.tac[x.dataset.tac]=x.value;S.plan.tactic=true;render();return}if(x.dataset.train){S.training[x.dataset.train]=x.value;S.plan.training=true;render();return}if(x.dataset.filter==='pos'){S.filters.pos=x.value;render();return}if(x.dataset.fin){S.finance[x.dataset.fin]=Number(x.value)||S.finance[x.dataset.fin];save();return}});
document.addEventListener('input',e=>{let x=e.target;if(!S||!x.dataset.slider)return;let sc=x.dataset.scope,k=x.dataset.slider;if(sc==='tac'){S.tac[k]=Number(x.value);S.plan.tactic=true}else{S.training[k]=Number(x.value);S.plan.training=true}render()});
document.addEventListener('pointerdown',e=>{let h=e.target.closest('[data-hold]');if(h){keys[h.dataset.hold]=true;return}let c=e.target.closest('#cv');if(!c||!MATCH)return;let r=c.getBoundingClientRect();let px=cl((e.clientX-r.left)/r.width*100),py=cl((e.clientY-r.top)/r.height*100);if(MATCH.mode==='momentos'){MATCH.ax=px;MATCH.ay=py;draw()}if(MATCH.mode==='completo'&&MATCH.full){MATCH.full.px=px;MATCH.full.py=py;draw()}});
document.addEventListener('pointerup',e=>{let h=e.target.closest('[data-hold]');if(h)keys[h.dataset.hold]=false});document.addEventListener('pointercancel',()=>{keys={}});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='j')fullAction('shoot');if(e.key==='k')fullAction('pass');if(e.key==='l')fullAction('cross');if(e.key==='i')fullAction('tackle')});document.addEventListener('keyup',e=>{keys[e.key]=false});
S=load();render();
})();
</script>
